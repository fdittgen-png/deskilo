# SPDX-License-Identifier: 0BSD
include: package:flutter_lints/flutter.yaml

analyzer:
  # #1060 — the three strict modes. Without them an expression like
  # `json['events'] as List? ?? const []` widens to List<dynamic> without
  # a word from the analyzer, and every use downstream is an implicit
  # dynamic call. The malformed-JSON aggregation and the empty-UUID
  # managed member were both that shape.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  plugins:
    - riverpod_lint

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - avoid_print
    - require_trailing_commas
    # #1125 — a `Future` nobody waits for is a write nobody checked.
    # #1094 was exactly that: `rescheduleCheckInReminders` was called
    # without `await`, so when it threw, the reminders were silently not
    # scheduled and the caller had already told the member the booking
    # was made. The rule makes the two cases different in the SOURCE —
    # `await` means the outcome matters here, `unawaited(...)` means it
    # deliberately does not — instead of leaving the reader to guess
    # from a missing keyword.
    - unawaited_futures
