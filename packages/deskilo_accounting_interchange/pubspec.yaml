name: deskilo_accounting_interchange
description: >-
  The accounting interchange contract (#3376 of #3328): the
  AccountingInterchangeV1 envelope a fiscal period of a book hands an
  accounting system, and the declaration an export format makes about itself
  (its writer family and the sources it reads). The formats are written against
  this package, the money kernel, the shared standards (the CSV cell writer)
  and crypto (a digest). Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  crypto: ^3.0.0
  deskilo_jurisdiction_standards:
    path: ../deskilo_jurisdiction_standards
  deskilo_money_kernel:
    path: ../deskilo_money_kernel

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
