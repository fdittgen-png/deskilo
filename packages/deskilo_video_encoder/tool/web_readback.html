<!--
  #1879 — readback of the browser encoder, outside Flutter.
  Serve the package directory (python3 -m http.server -d packages/deskilo_video_encoder)
  and open /tool/web_readback.html in a Chromium browser (headless:
  --headless --dump-dom). Encodes five 2-second solid-colour steps with
  ../assets/encoder.mjs, then reads the MP4 back: box walk (ftyp first,
  one avc1 track) and the browser's own VideoDecoder through Mediabunny's
  demuxer, checking each step's decoded colour, order and the duration.
  The verdict is the page's <pre id="out">, ending in ALL PASS or FAILED,
  and is also requested as /verdict?<text> so a headless run can read it
  from the server's log.
-->
<meta charset="utf-8">
<title>readback</title>
<pre id="out">running</pre>
<script type="module">
import * as enc from '../assets/encoder.mjs';
import { Input, BufferSource, ALL_FORMATS, VideoSampleSink } from '../assets/mediabunny.min.mjs';

const out = [];
let failures = 0;
const check = (ok, what) => { out.push((ok ? 'PASS ' : 'FAIL ') + what); if (!ok) failures++; };
const W = 640, H = 360, STEP = 2000;
const colors = [[200, 30, 30], [30, 160, 40], [30, 60, 200], [220, 180, 20], [140, 40, 160]];
try {
  check(await enc.probe(W, H, 2000000), 'probe: avc encodable here');
  const id = await enc.start(W, H, 2000000, 2000);
  for (let s = 0; s < colors.length; s++) {
    const f = new Uint8Array(W * H * 4);
    for (let i = 0; i < W * H; i++) f.set([...colors[s], 255], i * 4);
    for (let t = 0; t < STEP; t += 1000) await enc.addFrame(id, f, s * STEP + t);
  }
  const total = colors.length * STEP;
  const mp4 = await enc.finish(id, total);
  check(mp4.length > 0, `finalized ${mp4.length} bytes`);
  const type = (o) => String.fromCharCode(...mp4.subarray(o + 4, o + 8));
  check(type(0) === 'ftyp', 'MP4 container (ftyp first)');
  const text = new TextDecoder('latin1').decode(mp4);
  check(text.includes('avc1'), 'H.264 sample entry (avc1)');
  const input = new Input({ formats: ALL_FORMATS, source: new BufferSource(mp4) });
  const track = await input.getPrimaryVideoTrack();
  check(track && track.codec === 'avc', `codec ${track && track.codec}`);
  const seconds = await input.computeDuration();
  check(Math.abs(seconds - total / 1000) < 0.15, `duration ${seconds}s`);
  const sink = new VideoSampleSink(track);
  const seen = [];
  for await (const sample of sink.samples()) {
    const c = new OffscreenCanvas(W, H).getContext('2d');
    sample.draw(c, 0, 0);
    const [r, g, b] = c.getImageData(W / 2, H / 2, 1, 1).data;
    let best = 0, dist = 1e9;
    colors.forEach(([cr, cg, cb], i) => {
      const d = Math.abs(cr - r) + Math.abs(cg - g) + Math.abs(cb - b);
      if (d < dist) { dist = d; best = i; }
    });
    check(best === Math.floor(sample.timestamp * 1000 / STEP), `frame at ${sample.timestamp}s shows step ${best + 1}`);
    if (seen[seen.length - 1] !== best) seen.push(best);
    sample.close();
  }
  check(JSON.stringify(seen) === '[0,1,2,3,4]', `steps in order: ${seen}`);
  const id2 = await enc.start(W, H, 2000000, 2000);
  await enc.cancel(id2);
  let refused = false;
  try { await enc.addFrame(id2, new Uint8Array(W * H * 4), 0); } catch (_) { refused = true; }
  check(refused, 'a cancelled session accepts nothing');
} catch (e) {
  check(false, 'threw: ' + e);
}
out.push(failures === 0 ? 'ALL PASS' : failures + ' FAILED');
out.push(navigator.userAgent);
document.getElementById('out').textContent = out.join('\n');
// A headless run reads the verdict from the server's request log.
fetch('/verdict?' + encodeURIComponent(out.join('\n'))).catch(() => {});
</script>
