name: deskilo_tax_reference
description: >-
  The tax reference data model (#3401 of #3328): the typed rows a country's law
  decides (a rate, an exemption text, a VAT id pattern, the EU member set), the
  set that resolves them by date and the pure questions asked of it. The
  installed snapshot (ActiveTaxReference) stays in the application and hands a
  set to whoever needs one. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  deskilo_money_kernel:
    path: ../deskilo_money_kernel

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
