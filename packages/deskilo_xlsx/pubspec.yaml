name: deskilo_xlsx
description: >-
  The minimal XLSX writer (#395, #2861) as a package (#3429): rows of values
  in named tabs, a readable header, real dates and amounts. Pure Dart; the
  application's exports and the country add-ons' registers share ONE copy.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.9

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
