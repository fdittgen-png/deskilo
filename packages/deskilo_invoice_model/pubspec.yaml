name: deskilo_invoice_model
description: >-
  The invoice model (#3402 of #3328): the issued document, its frozen legal
  snapshot and clauses, the VAT regimes, rates and tax-point rules, and the
  place-of-supply decision. Every question about the tax reference takes the
  set as a parameter; the installed snapshot (ActiveTaxReference) stays in the
  application. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  deskilo_jurisdiction_standards:
    path: ../deskilo_jurisdiction_standards
  deskilo_money_kernel:
    path: ../deskilo_money_kernel
  deskilo_tax_reference:
    path: ../deskilo_tax_reference
  deskilo_vat_declaration:
    path: ../deskilo_vat_declaration
  freezed_annotation: ^3.0.0
  meta: ^1.16.0
  xml: ^6.6.1

dev_dependencies:
  build_runner: ^2.4.15
  freezed: ^4.0.2
  lints: ^6.0.0
  test: ^1.25.0
