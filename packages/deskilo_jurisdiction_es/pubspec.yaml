name: deskilo_jurisdiction_es
description: >-
  The Spanish VAT filing add-on (#3333): the Modelo 303 as the AEAT's
  fixed-width "diseño de registro" behind the jurisdiction contract. Pure Dart;
  depends on the contract and the standards packages.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  deskilo_jurisdiction_api:
    path: ../deskilo_jurisdiction_api
  deskilo_jurisdiction_standards:
    path: ../deskilo_jurisdiction_standards

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
