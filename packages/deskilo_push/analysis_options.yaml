# #4410 -- the error-handling rules the app holds (analysis_options.yaml).
analyzer:
  exclude:
    - build/**
linter:
  rules:
    - avoid_print
    - unawaited_futures
    - only_throw_errors
    - avoid_catches_without_on_clauses
    - empty_catches
