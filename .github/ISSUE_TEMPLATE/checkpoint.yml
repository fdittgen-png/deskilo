name: Checkpoint (implementation-ready slice)
description: One reviewable slice with its consumer, its tests and its stop condition
body:
  - type: markdown
    attributes:
      value: |
        The Ready, Done and closure rules: [docs/AGENT_RULES.md](https://github.com/fdittgen-png/deskilo/blob/master/docs/AGENT_RULES.md#ready-done-and-closure). A partial PR says `Refs`; `Closes` is for the PR that meets the whole acceptance. Fill "not applicable" with a reason rather than leaving a field empty.
  - type: textarea
    id: outcome
    attributes:
      label: Affected user and outcome
      description: Who gains what observable capability, and which goal it serves.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Current and expected behaviour
      description: The verified baseline (commit, file, test) and the intended change. Mark assumptions.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Minimal proving scenario
      description: The shortest realistic sequence that shows the result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, exclusions, consumer and prerequisites
      description: Included paths and contracts; checkpoint/integration owner and size boundary; adjacent work excluded; the real consumer; the exact prerequisite outcome and its evidence, or none.
    validations:
      required: true
  - type: textarea
    id: anchors
    attributes:
      label: Implementation anchors
      description: Existing files, symbols, migrations, representative tests and commands, verified on the checked-out commit.
  - type: dropdown
    id: contract
    attributes:
      label: Domain contract impact
      description: Choose one; identify the affected views in the reference and delta below (docs/domain/contracts/README.md).
      multiple: false
      options:
        - unchanged — no business rule changes
        - changed — data, transitions, authority or effects
    validations:
      required: true
  - type: textarea
    id: delta
    attributes:
      label: Contract reference and delta
      description: |
        Link the affected page or invariant row, or explain why no business rule applies. If unchanged, give the reason.
        If changed, name each affected view (data, transitions, authority, effects), current → proposed rule and its source (issue, decision), including lifecycle exceptions.
        For a lifecycle, include trigger and actor, guards, atomic and external effects, outcomes and prohibited effects, retry identity and uncertain-outcome recovery.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - R0 — no runtime, policy, privacy or contractual effect
        - R1 — reversible behaviour change, ordinary UI or API work, refactoring
        - R2 — authorisation, money, personal data, destructive operation, submission to a third party, credentials, binding rules
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and tests
      description: |
        One line per criterion with its test ids and when it is required (merge / activation / release / external acceptance). Each test names setup, action, expected result and side effects, the oracle, the layer. A heading like "success / refusal / recovery" is not a test.
      value: |
        | AC | Observable criterion | Tests | Required by |
        |---|---|---|---|
        | AC-1 |  |  | merge |
    validations:
      required: true
  - type: textarea
    id: completeness
    attributes:
      label: Completeness and rollout
      description: Setup questionnaire, locales, help, registries, Demo case, migration compatibility, enablement, monitoring, recovery; deferred evidence with its gate and the action it restricts.
  - type: textarea
    id: done
    attributes:
      label: Done when, and pause conditions
      description: The exact closure boundary, and the thresholds (scope, authority, dependency, conflict) at which to stop and record instead of continuing.
    validations:
      required: true
