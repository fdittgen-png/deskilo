name: CI · Tool lines on an edited pull request

# #3677 — the static gates of the Quality run read the pull request's title and
# text when the run starts. Editing them afterwards must not start the whole
# suite again, so an edit runs only this check: the same script, the same
# patterns, in seconds.
on:
  pull_request:
    types: [edited]

concurrency:
  # #3763 -- for a MERGED pull request the run's ref is the base branch, so
  # the ref alone is one group for every merged pull request: the number keeps
  # two corrected descriptions from cancelling each other.
  group: tool-lines-${{ github.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tool-lines:
    name: no tool line in the edited pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # #3763 -- an edit of a MERGED pull request checks out the base branch,
      # and the head of a squash-merged, deleted branch is on no branch: the
      # range BASE..HEAD would not resolve and the script would refuse. The
      # host keeps refs/pull/<n>/head after the branch is gone.
      - name: Fetch the pull request head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/tool_lines_check.sh
