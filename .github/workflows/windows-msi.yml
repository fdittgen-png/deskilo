name: windows-msi

# Windows MSI installer (WiX v5, dev-apk pattern):
#   gh workflow run windows-msi.yml -f ref=master
#   gh run download <run-id> --dir /tmp/deskilo-msi
# Also builds on PRs touching the Windows target (validates the packaging
# before merge) and attaches the MSI to the release on version tags.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: false
        default: master
  pull_request:
    paths:
      - .github/workflows/windows-msi.yml
      - windows/**
  push:
    tags: ["v*"]

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  msi:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build Windows release
        run: flutter build windows --release

      - name: Read version from pubspec
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          # MSI ProductVersion must be numeric x.y.z — strip the build number.
          $msi = $raw.Split('+')[0]
          "raw=$raw" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT

      - name: Install WiX toolset
        # Pinned to v5: WiX v7+ requires accepting the Open Source
        # Maintenance Fee EULA (WIX7015); v5 is free and uses the same
        # v4/v5 authoring schema as deskilo.wxs.
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package MSI
        shell: pwsh
        run: |
          # ABSOLUTE path: WiX resolves a <Files Include> wildcard relative
          # to the .wxs, not to the working directory, so a repo-relative
          # PublishDir silently harvested NOTHING — every MSI built before
          # this fix was 6 KB of shortcut with no application in it.
          $publish = (Resolve-Path build\windows\x64\runner\Release).Path
          if (-not (Test-Path (Join-Path $publish 'deskilo.exe'))) {
            throw "No deskilo.exe in $publish — the Flutter build did not produce a release bundle."
          }
          $msi = "build\DesKilo-${{ steps.version.outputs.raw }}.msi"
          wix build windows/installer/deskilo.wxs `
            -arch x64 `
            -d ProductVersion=${{ steps.version.outputs.msi }} `
            -d PublishDir=$publish `
            -o $msi
          # An empty harvest is not an error to WiX, so the size is the
          # only thing standing between a green run and an installer that
          # installs nothing.
          $size = (Get-Item $msi).Length
          Write-Host ("MSI size: {0:N1} MB" -f ($size / 1MB))
          if ($size -lt 10MB) {
            throw "MSI is only $size bytes — the payload harvest matched nothing."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DesKilo-${{ steps.version.outputs.raw }}-windows-msi
          path: build/DesKilo-${{ steps.version.outputs.raw }}.msi
          if-no-files-found: error

      # Version tags get the MSI attached to their GitHub release.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/DesKilo-${{ steps.version.outputs.raw }}.msi
