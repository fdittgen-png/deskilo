name: Publish · Web app (GitHub Pages)

# The browser build (dev-apk pattern):
#   gh workflow run web.yml                       # artifact only
#   gh workflow run web.yml -f deploy=true        # …and publish to Pages
#   gh run download <run-id> --dir /tmp/deskilo-web
#
# Also builds on pull requests, so a change that only breaks the browser (a
# dart:io import reaching web code, a plugin without a web implementation)
# is caught before merge rather than by a user. WHICH pull requests is not
# a path list here: #1446 C2 — the same classifier the quality workflow
# runs (.github/actions/classify-change, on the complete diff) says whether
# the change reaches the browser build, and the build stands down only
# with that verdict read back from its artifact. A classifier that died
# builds.
#
# PUBLISHING IS OPT-IN. `deploy=true` puts the app on the public internet at
# the repository's Pages URL — with the committed Supabase URL and
# publishable key baked in (RLS is the boundary, see ADR 0002), which is the
# same pair every store binary already ships. Still a deliberate act: leave
# it false and the run only produces a zip.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: false
        default: master
      deploy:
        description: Publish the build to GitHub Pages (public URL)
        required: false
        type: boolean
        default: false
  # #570 — the release train reuses this workflow verbatim.
  workflow_call:
    inputs:
      source_sha:
        description: The full commit SHA to build — resolved once by the caller (#1446 C4)
        required: true
        type: string
      deploy:
        required: false
        type: boolean
        default: false
  pull_request:

env:
  FLUTTER_VERSION: "3.47.5"

# Pages needs both: id-token to mint the deployment, pages to publish it.
permissions:
  contents: read
  pages: write
  id-token: write

# One group per ref AND per purpose: a superseded PR push still cancels
# its predecessor, but the release train's web leg (deploy=false, called
# on master) and a standalone `-f deploy=true` dispatch on the same ref
# no longer cancel each other — that collision is what left the train's
# web leg 'cancelled' in #715 and swallowed two Pages deploys on 08-29.
# #1446 C4 — and only a pull request cancels: a dispatch or a train leg
# someone started on purpose queues behind its predecessor instead.
concurrency:
  group: web-${{ github.ref }}-${{ github.event_name }}-${{ inputs.deploy == true }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: classify the change · web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.verdict.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - id: verdict
        uses: ./.github/actions/classify-change
        with:
          artifact: web-classification

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify]
    # Always evaluated, so the check reports on every pull request — built,
    # or stood down with the reason. The release train and a dispatch are
    # not pull requests and always build.
    if: always()
    env:
      WEB_REQUIRED: ${{ needs.classify.outputs.web != 'not_applicable' }}
    steps:
      - name: Stand down only with the verdict on record
        if: env.WEB_REQUIRED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: web-classification
          path: report
      - if: env.WEB_REQUIRED != 'true'
        run: |
          grep -E '^web\|not_applicable\|' report/classification.txt
          echo "the browser build is not required for this change: $(sed -n 's/^web|not_applicable|\([^|]*\)|.*/\1/p' report/classification.txt)"

      # #1446 C4 — one full SHA fixed BEFORE the checkout (the caller's, the
      # dispatch ref resolved here, or this event's); no other HEAD builds.
      - name: Pin the source
        id: source
        if: env.WEB_REQUIRED == 'true'
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$SOURCE_SHA"
          [ -n "$sha" ] || [ -z "$REF" ] || sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$(jq -rn --arg r "$REF" '$r|@uri')" --jq .sha)
          sha="${sha:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the source did not resolve to a commit (got '$sha')"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Candidate: $sha"

      - uses: actions/checkout@v4
        if: env.WEB_REQUIRED == 'true'
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Base href
        id: base
        if: env.WEB_REQUIRED == 'true'
        # Pages serves the site under /<repo>/, so the base href has to
        # match or every asset 404s. A plain artifact build stays at '/'.
        run: |
          if [ "${{ inputs.deploy }}" = "true" ]; then
            BASE="/${GITHUB_REPOSITORY#*/}/"
          else
            BASE="/"
          fi
          echo "Base href: $BASE"
          echo "base_href=$BASE" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/source-identity
        if: env.WEB_REQUIRED == 'true'
        with:
          sha: ${{ steps.source.outputs.sha }}
          leg: web
          base_href: ${{ steps.base.outputs.base_href }}

      - uses: subosito/flutter-action@v2
        if: env.WEB_REQUIRED == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        if: env.WEB_REQUIRED == 'true'
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.base.outputs.base_href }}"

      - name: SPA fallback for deep links
        # go_router uses real paths; a reload of /money must not 404 on a
        # static host, and Pages serves 404.html for anything it cannot
        # find. Serving the app there makes the reload work.
        if: env.WEB_REQUIRED == 'true'
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-artifact@v4
        if: env.WEB_REQUIRED == 'true'
        with:
          name: deskilo-web-${{ steps.source.outputs.sha }}
          path: build/web
          retention-days: 14

      - name: Upload Pages artifact
        if: env.WEB_REQUIRED == 'true' && inputs.deploy == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    # Only ever on an explicit dispatch with deploy=true — never on a PR.
    # Not on pull_request builds; a dispatch OR a release-train call with
    # deploy=true publishes (#570).
    # `needs.build.result == 'success'` is spelled out because `build` is
    # itself `if: always()`: a stood-down or failed build must not publish.
    if: ${{ github.event_name != 'pull_request' && inputs.deploy == true && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
