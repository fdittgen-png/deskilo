name: Status · Edge function drift

# #3520 -- do the functions deployed on the DEV project match
# supabase/functions? One read of the Management API; nothing is deployed,
# changed or written to the project.
#
# Three results, never two (tool/edge_deployment_drift.dart):
#   verified      green: the same functions, the same verify_jwt
#   drift         red: a function missing, an orphan, or a flipped verify_jwt
#   not verified  red: the check could not look (no token, no ref, a ref that
#                 is not the dev project, a refused token, an unreadable
#                 answer). A missing credential must never read as a pass,
#                 so this run ends RED without one and says why in its summary.
#
# Needs, set by the repository owner (nothing here creates them):
#   secret    SUPABASE_ACCESS_TOKEN       a token that can read the dev project
#   secret    SUPABASE_DEV_PROJECT_REF    the dev project's ref
#   variable  EDGE_DRIFT_EXPECTED_REF     the same ref, as a repository variable:
#             a ref typed into the dispatch input (a production ref pasted by
#             hand) that differs from it is refused, not examined.
#
# Manual only at first. A schedule is added once the credentials exist: a
# scheduled run's red mark lands on whatever commit master's head is (#3750).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Dev project ref to examine (default SUPABASE_DEV_PROJECT_REF)
        required: false
        type: string
        default: ''

concurrency:
  group: edge-drift
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.5"

permissions:
  contents: read

jobs:
  drift:
    name: deployed functions equal supabase/functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      # The token reaches only this step, as an environment variable the tool
      # reads and never prints; the log and the summary carry slugs and
      # verify_jwt values, never a response body.
      - name: Compare the dev project with the repository
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ inputs.ref != '' && inputs.ref || secrets.SUPABASE_DEV_PROJECT_REF }}
          EXPECTED_REF: ${{ vars.EDGE_DRIFT_EXPECTED_REF }}
        run: >
          dart run tool/edge_deployment_drift.dart
          --ref "$REF" --expected-ref "$EXPECTED_REF"
          --summary "$GITHUB_STEP_SUMMARY"
