name: CI · Quality report

# #1244 — a failure says WHICH DISCIPLINE regressed.
#
# The old gate was good and it was the whole gate: l10n, analyze, tests,
# 65% coverage. The accessibility and contrast tests ran, but only inside
# the general suite, so a regression read as "a test failed" — which is
# exactly the sentence that gets skimmed. Nine disciplines, nine named
# steps, one table in the run summary.
#
# This workflow replaces `db.yml` (#1226). Its database work is unchanged
# and lives in the `quality: database` job below; folding it in is what
# lets one report cover both halves instead of two workflows each knowing
# half the answer.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # The schema can break from underneath us when a Supabase platform
    # image changes; a nightly run says so before a branch does.
    - cron: '30 4 * * *'
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  # #1446 C2 — which work this change REQUIRES, decided by the checked-in
  # classifier from the complete diff (full git data, NUL-delimited names,
  # renames counted twice) through .github/actions/classify-change — the
  # same invocation web.yml makes, so there is one decision and no path
  # list to drift from it. It selects work, never whether a run may
  # report: every required context below still reports. Anything the
  # classifier cannot prove independent runs everything; so does every
  # push to master, the nightly run, a manual dispatch, a diff it could
  # not read completely, and a classifier that died — a missing verdict
  # is `required`, never `not_applicable`.
  classify:
    name: classify the change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.verdict.outputs.database }}
      web: ${{ steps.verdict.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - id: verdict
        uses: ./.github/actions/classify-change
        with:
          artifact: quality-classification

  code:
    # The name is the REQUIRED STATUS CHECK on master, and this job is
    # what now does that work — the l10n gate, analyze, the suite with
    # coverage — plus the disciplines. Renaming it would silently make
    # every pull request unmergeable, because branch protection waits
    # for a context that would never report again. (It waited for
    # exactly that for one push; ci.yml's own comment said the
    # repository had no protection, and it was out of date.)
    name: analyze · l10n gate · test · coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 2026-09-26: the full suite passed 26 min on Flutter 3.47.5; 30 cut it off
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # #1446 C3 — the packages, keyed on the lockfile: a miss resolves
      # them from pub.dev as before; a hit is the same tree pub would
      # resolve, so nothing about the candidate is inferred from it.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-
      - run: flutter pub get

      # The gates that are not a discipline row: they are preconditions,
      # and a red one makes every row below it meaningless rather than
      # merely worse. They fail the job immediately, as they always did.
      - name: l10n gate — the ARB pipeline is clean and committed
        run: |
          dart run tool/build_arb.dart
          flutter gen-l10n
          git diff --exit-code -- lib/l10n \
            || { echo "::error::lib/l10n drift — run 'dart run tool/build_arb.dart && flutter gen-l10n' and commit (HARD RULE #4)"; exit 1; }

      # #1446 C5a — HARD RULE 3, enforced: the generated code is what
      # build_runner writes for this tree. This job compiles what is
      # committed and never regenerated, so on 2026-09-25 master carried
      # five `.g.dart` files a provider hash behind their sources; the
      # F-Droid audit, which regenerates as F-Droid's builder does, moved
      # a capability fingerprint and was red on master while this job
      # was green. Same script, same command, in that workflow.
      - name: codegen gate — build_runner output is committed
        run: |
          bash scripts/generated_drift.sh \
            'dart run build_runner build --delete-conflicting-outputs' \
            -- '*.g.dart' '*.freezed.dart'

      # #1558 — the push transport's own suite. It cannot live in the
      # app's test/ because the F-Droid job swaps this package for the
      # Google-free twin before running that suite (#716), so a root
      # test importing Firebase would not compile there. One step, or
      # the connector's endpoint regression never runs.
      - name: Tests of the push transport package
        run: flutter test
        working-directory: packages/deskilo_push

      - name: Analyze (lib + test)
        # Direct Dart analysis waits for analyzer plugins to finish.
        run: dart analyze --fatal-infos

      # #1446 C1 — ONE run of the suite, with coverage, for the whole
      # report. The discipline rows below are derived from this run's JSON
      # stream by test identity (tool/quality_rows.dart against
      # .github/quality-manifest.psv) instead of starting Flutter five more
      # times for the same tests. The exit code is captured as the verdict
      # and written beside the stream; nothing in between may replace it.
      - name: Tests with coverage
        id: tests
        continue-on-error: true
        run: |
          mkdir -p report
          set +e
          flutter test --coverage --file-reporter json:report/tests.jsonl
          code=$?
          set -e
          echo "$code" > report/tests-exit.txt
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      # Every discipline row, from that one stream. A stream that was cut
      # short, loaded nothing, or holds something the reader does not
      # understand makes every row red and this step red — a reporting
      # failure is a failure, not a green table.
      - name: Discipline rows from the test stream
        id: rows
        if: always()
        continue-on-error: true
        run: |
          dart run tool/quality_rows.dart \
            --events report/tests.jsonl \
            --exit-code "$(cat report/tests-exit.txt 2>/dev/null || echo 1)" \
            --manifest .github/quality-manifest.psv \
            --out report/tests.psv

      - name: Coverage
        id: coverage
        if: always()
        continue-on-error: true
        run: bash scripts/coverage_gate.sh

      # ADVISORY, deliberately non-blocking. Master DOES have protection
      # — one required context, this job's name — and `branch_protection.sh`
      # names the two the database half should add. Applying that is a
      # repository-settings change and belongs to whoever owns the
      # repository, so this reports the drift rather than failing over it.
      #
      # #1446: `--advisory` still exits 0, but prints and summarises
      # `result=`. This token cannot read protection, so the honest answer
      # is `unverified-access`: a green step is NOT settings evidence.
      - name: Branch protection drift (advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/branch_protection.sh verify --advisory

      - name: Rows
        if: always()
        run: |
          mkdir -p report
          # The test-derived rows are already in report/tests.psv; a rows
          # step that could not run leaves a red Tests row so the report
          # still says what happened.
          [ -f report/tests.psv ] || echo 'Tests|failure|the rows step did not run' > report/tests.psv
          printf 'Coverage|%s|%s\n' "${{ steps.coverage.outcome }}" \
            "$(cat report/coverage-line.txt 2>/dev/null || echo 'not measured')" > report/code.psv
          cat report/tests.psv report/code.psv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-code
          path: |
            report/*.psv
            report/tests-exit.txt

      # #1446 — the required context carries the WHOLE result of this job.
      # Until now the coverage gate ran continue-on-error and only the
      # final report noticed, and the report is not a required context:
      # a coverage regression could not block a merge. It can now.
      - name: Gate
        if: always()
        run: |
          bash scripts/job_gate.sh \
            "Tests=${{ steps.tests.outcome }}" \
            "Discipline rows=${{ steps.rows.outcome }}" \
            "Coverage=${{ steps.coverage.outcome }}"

  database:
    name: quality · database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [classify]
    # Always evaluated: a classify job that died must not skip this one,
    # because a skipped required context counts as passing.
    if: always()
    env:
      # #1446 C2 — only an explicit `not_applicable` stands the job down;
      # `required`, an empty output from a classify job that died, or a
      # word nobody expected all run the work. Standing down writes every
      # database row as such, with the classifier's reason, and BOTH this
      # job and the report accept that only with the classification
      # artifact in hand.
      DB_VERDICT: ${{ needs.classify.outputs.database }}
      DB_REQUIRED: ${{ needs.classify.outputs.database != 'not_applicable' }}
    steps:
      - uses: actions/checkout@v4
      - name: The verdict
        run: |
          echo "classify: ${{ needs.classify.result }}; database: ${DB_VERDICT:-(no verdict)}; running: $DB_REQUIRED"
          if [ "$DB_VERDICT" != "required" ] && [ "$DB_VERDICT" != "not_applicable" ]; then
            echo "::warning::the classifier delivered no verdict — running everything; the report job fails on the classify result"
          fi
      - name: The verdict artifact
        id: verdict_file
        if: env.DB_REQUIRED != 'true'
        uses: actions/download-artifact@v4
        with:
          name: quality-classification
          path: report
      - name: Stand down only with the verdict on record
        id: standdown
        if: env.DB_REQUIRED != 'true'
        run: grep -E '^database\|not_applicable\|' report/classification.txt
      - uses: supabase/setup-cli@v1
        if: env.DB_REQUIRED == 'true'
        with:
          # Pinned, not `latest`: resolving the newest release at run time
          # asks the GitHub API unauthenticated on every job, and on
          # 2026-09-25 that lookup was rate-limited across several pull
          # requests at once — "Failed to resolve latest Supabase CLI
          # release: rate limit exceeded" reddened a job that touched no
          # SQL. A floating version is also not reproducible: the replay
          # that decides `contract.txt` should not change because a
          # release was published between two runs. Bump deliberately.
          version: 2.118.0
      - uses: denoland/setup-deno@v2
        if: env.DB_REQUIRED == 'true'
        with:
          deno-version: v2.x

      # The assertion nobody had ever made before #1226: that every
      # migration replays onto an EMPTY database, in order, without the
      # dev project's accumulated state underneath. A migration history
      # that only works against a database that already exists cannot
      # rebuild production, and we would find that out on the day we
      # needed to.
      #
      # #1446 C5 — the start is the composite action, and it happens ONCE
      # in this job: every step below attaches to this stack, through
      # the address it publishes or `supabase status` on the runner. A
      # producer added later (MCP, auth) is one more step after it.
      - name: Migration safety
        id: migrations
        if: env.DB_REQUIRED == 'true'
        continue-on-error: true
        uses: ./.github/actions/local-stack

      - name: Database disciplines
        id: pgtap
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: |
          # #1335 — without pipefail this step reported `tee`'s exit code,
          # so a failing pgTAP run could never turn it red.
          set -o pipefail
          supabase test db 2>&1 | tee report-pgtap.log

      # #1313 — the policies the migrations actually build, read from the
      # replay and never parsed out of the SQL: 0030 creates a policy 0051
      # drops with its table, and a text parser still expects it. The
      # doctor compares a live project against this file, which is the
      # only check that can see a policy no migration created.
      - name: Policies equal the migrations
        id: policies
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          DB_URL: ${{ steps.migrations.outputs.db-url }}
        run: |
          set -o pipefail
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At \
            -c "select schemaname || '.' || tablename || '.' || policyname
                  from pg_policies where schemaname in ('public', 'storage')
                 order by 1" > replay-policies.txt
          grep -vE '^[[:space:]]*(#|$)' assets/instance/policies.txt > committed-policies.txt
          if ! diff -u committed-policies.txt replay-policies.txt; then
            echo "::error::assets/instance/policies.txt is not what the migrations build — copy the + side into the file (keep its header)"
            exit 1
          fi
          echo "policies: $(wc -l < replay-policies.txt | tr -d ' ') match"

      # #1455 — the effective SQL contract, read from the replay: the
      # signatures, grants and body digests a reviewer would otherwise have
      # to reconstruct from fifty anchored patches. Committed, like the
      # policy manifest; the full definitions ride the artifact.
      - name: Effective contract
        id: contract
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          DB_URL: ${{ steps.migrations.outputs.db-url }}
        run: bash scripts/contract_check.sh "$DB_URL"

      # #1232 — the one property no pgTAP file can make, because every
      # one of them runs in a single transaction and a race needs two
      # connections. Two real psql processes, one seat.
      - name: Two sessions, one seat
        id: race
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          DB_URL: ${{ steps.migrations.outputs.db-url }}
        run: bash scripts/concurrency_check.sh "$DB_URL"

      # #1329 — the feature-flag write compares its read-set and merges
      # under ONE row lock. Two real sessions prove there is no window
      # between the comparison and the write.
      - name: Two owners, one decision
        id: flags
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          DB_URL: ${{ steps.migrations.outputs.db-url }}
        run: bash scripts/feature_flags_race.sh "$DB_URL"

      # #1450 — the SQL tests inject a caller and `deno check` reads types;
      # neither shows how an Edge function composes its clients. This runs
      # the real payment handler with real signed-in users against the
      # replayed database and a local provider stub.
      - name: A member can start a payment
        id: payments
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/edge_payment_check.sh

      # #1637 — the money must actually arrive, and only when it did. The
      # same real handlers, a stateful local Stripe boundary, locally
      # signed events: paid, unpaid-then-async, async failure, duplicate,
      # expiry, bad signature, wrong amount, unknown session, two
      # deliveries at once, and the webhook that never comes.
      - name: A Stripe payment settles
        id: settlement
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/edge_payment_check.sh --settle stripe

      # #1638 — PayPal: approval is not money. A stateful local PayPal
      # (token, Orders v2 create/detail/capture, signature verification),
      # the real handlers: capture once per order under a fixed request id,
      # a lost capture reply, an order captured elsewhere, a verifier
      # outage, a forged signature, a foreign amount/currency/reference.
      - name: A PayPal payment settles
        id: settlement_paypal
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/edge_payment_check.sh --settle paypal

      # #1639 — Mollie and Wero, each with its own key and payments: the
      # classic callback is a notification, the fetched payment must be the
      # intent's in reference, amount, currency, method and mode.
      - name: A Mollie or Wero payment settles
        id: settlement_mollie
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/edge_payment_check.sh --settle mollie

      # #1613/#1614 — a delegated (OAuth client) token through the real
      # PostgREST: the facade answers, every raw table, business RPC,
      # OpenAPI and GraphQL route is refused; a native session is unchanged.
      - name: A delegated token reaches only the MCP facade
        id: containment
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/mcp_containment_check.sh

      # #1310 — OPERATIONS.md has documented the dump and the restore
      # since the day it was written, and nothing had ever executed it.
      # A backup procedure that has never been restored is a hope, not a
      # recovery plan. Every pgTAP file rolls back, so this is the one
      # fixture that persists: it is seeded, dumped, restored into a
      # fresh database, and the copy is made to prove itself — equal row
      # counts, a clean reconciliation per workspace, tenants intact.
      #
      # #1446 C5 — its seed is the only data that stays in the SHARED
      # database, so it runs after every step that expects to find only
      # its own rows there (the race scripts remove theirs, the payment
      # checks name theirs by run). The two drills after it work in
      # databases of their own. test/lint/local_stack_harness_test.dart
      # holds this order.
      - name: Restore drill
        id: restore
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/restore_check.sh

      # #1337 — the install, the resume, the readiness verdict and the
      # doctor were proven against a fake Management API only. This runs
      # the real Dart code on databases that start as an empty Supabase
      # project, through psql: install from empty, an interrupted install
      # resumed, an upgrade from N, a foreign table that blocks, the marker
      # after every migration, and a failing doctor probe. Function
      # deploys and auth settings stay uncovered: no local Management API.
      - uses: subosito/flutter-action@v2
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install, resume and upgrade a real schema
        id: lifecycle
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        env:
          KEEP_EMPTY: '1'
        run: |
          flutter pub get
          bash scripts/instance_lifecycle_check.sh

      # #1338 — the replay proves the migrations run and the drill proves
      # a current backup comes back; neither says what the next twenty
      # migrations do to an instance that already holds issued invoices,
      # posted credits and captured payments. This installs a supported
      # populated baseline (0226) on the empty project the lifecycle check
      # left behind, seeds that archive, upgrades it, and compares every
      # signed field, hash, posting and payment relation before and after;
      # then applies a deliberately destructive control through the same
      # path to prove the comparison can fail.
      - name: A populated instance upgrades and keeps its archives
        id: archive
        if: steps.migrations.outcome == 'success'
        continue-on-error: true
        run: bash scripts/populated_upgrade_check.sh

      - name: Rows
        if: always()
        run: |
          mkdir -p report
          if [ "$DB_REQUIRED" != "true" ]; then
            # The classifier stood this job down: every row says so, with
            # its reason, and the report cross-checks the classification.
            reason=$(sed -n 's/^database|not_applicable|\([^|]*\)|.*/\1/p' report/classification.txt 2>/dev/null | head -1)
            awk -F'|' '!/^[[:space:]]*(#|$)/ && $2 == "database" {print $1"|not_applicable|"r}' r="${reason:-classifier stood the database job down}" .github/quality-manifest.psv > report/database.psv
            cat report/database.psv
            exit 0
          fi
          count=$(ls supabase/tests/database/*.sql | wc -l | tr -d ' ')
          migrations=$(ls supabase/migrations/*.sql | wc -l | tr -d ' ')
          tenancy=$(sed -n 's/.*tenancy matrix: \([0-9]*\) tables covered.*/\1/p' report-pgtap.log 2>/dev/null | head -1)
          {
            printf 'Migration safety|%s|%s migrations replayed from empty\n' \
              "${{ steps.migrations.outcome }}" "$migrations"
            printf 'Tenant isolation|%s|%s workspace-scoped tables swept for read, update and delete, both roles\n' \
              "${{ steps.pgtap.outcome }}" "${tenancy:-0}"
            printf 'Financial invariants|%s|append-only ledger, reconciliation, webhook idempotency\n' \
              "${{ steps.pgtap.outcome }}"
            printf 'Concurrency|%s|two sessions race for one seat, exactly one wins\n' \
              "${{ steps.race.outcome }}"
            printf 'Conditional writes|%s|two owners decide on one feature map, the second is refused under the lock\n' \
              "${{ steps.flags.outcome }}"
            printf 'Query budgets|%s|indexes exist, the planner uses them at 5 000 rows\n' \
              "${{ steps.pgtap.outcome }}"
            printf 'Policy drift|%s|live policies equal the set the migrations build\n' \
              "${{ steps.policies.outcome }}"
            printf 'Effective contract|%s|routines, grants, constraints and triggers of the replay equal the committed contract\n' \
              "${{ steps.contract.outcome }}"
            printf 'Restore drill|%s|seeded, dumped, restored into a fresh database, counts equal and reconciled\n' \
              "${{ steps.restore.outcome }}"
            printf 'Payments|%s|the real payment handler opens the caller'"'"'s intent; strangers and no token refused\n' \
              "${{ steps.payments.outcome }}"
            printf 'Payment settlement|%s|Stripe: paid credits once, unpaid does not, async success once, failure and expiry mark failed, bad signature and wrong amount refused, duplicate and concurrent delivery credit once, a lost webhook stays pending, reconciliation clean\n' \
              "${{ steps.settlement.outcome }}"
            printf 'PayPal settlement|%s|approved orders captured once under a fixed request id and settled from the capture; unapproved, forged, verifier outage and foreign amount/currency/reference refused before capture; lost capture reply and reordered callbacks credit once; reconciliation clean\n' \
              "${{ steps.settlement_paypal.outcome }}"
            printf 'Mollie and Wero settlement|%s|each method with its own key; paid credits once, open and authorized do not, canceled/expired/failed mark failed; wrong method, currency, amount, mode or reference and provider outage credit nothing; duplicate and concurrent callbacks credit once; next-generation payloads refused; reconciliation clean\n' \
              "${{ steps.settlement_mollie.outcome }}"
            printf 'MCP token containment|%s|a delegated token reaches POST /rpc/mcp_execute_v1 and nothing else through the real PostgREST; native sessions unchanged\n' \
              "${{ steps.containment.outcome }}"
            printf 'Instance lifecycle|%s|empty install, interrupted resume, upgrade from N, foreign table blocks, marker per migration, doctor probe isolation\n' \
              "${{ steps.lifecycle.outcome }}"
            printf 'Archive preservation|%s|a populated 0226 instance upgraded to the tip: signed fields, hashes and postings byte-equal, legacy stays unverifiable, a destructive control is caught\n' \
              "${{ steps.archive.outcome }}"
          } > report/database.psv
          cat report/database.psv

      - name: What the database looked like when it failed
        if: failure() || steps.migrations.outcome == 'failure' || steps.pgtap.outcome == 'failure'
        run: supabase logs db || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-database
          path: report/

      # #1335 — the steps above run continue-on-error so the report is
      # always complete. This is what makes it a gate: the job fails when
      # any of them did not SUCCEED — skipped included — and a database
      # regression is reported apart from the Flutter job. Stood down, the
      # only success that counts is the verdict read back from the artifact.
      - name: Gate
        if: always()
        run: |
          if [ "$DB_REQUIRED" != "true" ]; then
            exec bash scripts/job_gate.sh \
              "The verdict artifact=${{ steps.verdict_file.outcome }}" \
              "Stand down only with the verdict on record=${{ steps.standdown.outcome }}"
          fi
          bash scripts/job_gate.sh \
            "Migration safety=${{ steps.migrations.outcome }}" \
            "Database disciplines=${{ steps.pgtap.outcome }}" \
            "Policies equal the migrations=${{ steps.policies.outcome }}" \
            "Effective contract=${{ steps.contract.outcome }}" \
            "Two sessions, one seat=${{ steps.race.outcome }}" \
            "Two owners, one decision=${{ steps.flags.outcome }}" \
            "Restore drill=${{ steps.restore.outcome }}" \
            "A member can start a payment=${{ steps.payments.outcome }}" \
            "A Stripe payment settles=${{ steps.settlement.outcome }}" \
            "A PayPal payment settles=${{ steps.settlement_paypal.outcome }}" \
            "A Mollie or Wero payment settles=${{ steps.settlement_mollie.outcome }}" \
            "A delegated token reaches only the MCP facade=${{ steps.containment.outcome }}" \
            "Install, resume and upgrade a real schema=${{ steps.lifecycle.outcome }}" \
            "A populated instance upgrades and keeps its archives=${{ steps.archive.outcome }}"

  # #1446 C2 — the always-evaluated final gate. It is red unless every
  # row is green or independently stood down by the classifier's own
  # artifact, AND every job it waits on actually succeeded: a classifier
  # that died, a cancelled code job, a database job that never reported —
  # each is red here, whatever the table says.
  report:
    name: quality · report
    runs-on: ubuntu-latest
    needs: [classify, code, database]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: quality-*
          merge-multiple: true
          path: report

      - name: DESKILO QUALITY REPORT
        if: always()
        run: bash scripts/quality_report.sh report .github/quality-manifest.psv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-report
          path: report/quality-report.md

      - name: Every job this run required succeeded
        if: always()
        run: |
          bash scripts/job_gate.sh \
            "classify the change=${{ needs.classify.result }}" \
            "analyze · l10n gate · test · coverage=${{ needs.code.result }}" \
            "quality · database=${{ needs.database.result }}"
