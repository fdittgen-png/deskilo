name: CI · Android video encoder

# #1879 — the task-recorder tutorial video on a REAL Android encoder.
# Runs integration_test/task_video_encoder_test.dart on an API 34 x86_64
# emulator: the app draws the frames, the platform MediaCodec (the
# emulator's software AVC encoder, c2.android.avc.encoder) and MediaMuxer
# write the MP4, and the test walks the MP4 boxes independently (ftyp,
# one avc1 track, duration, sample count, no canary). Only when the
# encoder, its Dart side or the test change; it is evidence, not a gate
# on every pull request.

on:
  pull_request:
    paths:
      - 'packages/deskilo_video_encoder/**'
      - 'lib/features/task_recorder/video/**'
      - 'integration_test/task_video_encoder_test.dart'
      - '.github/workflows/android-video.yml'
  workflow_dispatch:

concurrency:
  group: android-video-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  encode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the integration test apk before the emulator starts
        run: |
          flutter pub get
          flutter build apk --debug --target-platform android-x64 \
            --target integration_test/task_video_encoder_test.dart

      # No AVD cache: a cold boot costs minutes, which this evidence run
      # can afford, and a fourth cache kind is not worth its lint bump.
      - name: Encode on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb uninstall de.deskilo.app || true
            flutter test integration_test/task_video_encoder_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee video-encoder.txt
            adb shell getprop ro.build.version.release >> video-encoder.txt
            adb shell dumpsys media.player 2>/dev/null | grep -i "avc.encoder" | head -3 >> video-encoder.txt || true
            grep -q "All tests passed" video-encoder.txt

      - name: Upload the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-video-encoder
          path: video-encoder.txt
          if-no-files-found: ignore
