name: macos-app

# macOS desktop build, signed with Developer ID, notarised by Apple and
# packaged as a DMG:
#   gh workflow run macos-app.yml -f sync_certs=true   # ONCE: mint the cert
#   gh workflow run macos-app.yml -f ref=master        # build + notarise
#   gh run download <run-id> --dir /tmp/deskilo-dmg
# Also builds on PRs touching the macOS target, and attaches the DMG to the
# release on version tags.
#
# WHY NOTARISATION IS NOT OPTIONAL: since macOS 15 a downloaded app that
# Apple has not notarised is refused outright — "Apple n'a pas pu confirmer
# que DesKilo ne contenait pas de logiciel malveillant" — and the old
# right-click → Open escape hatch is gone. Without this the DMG is a file
# people cannot open.
#
# A PR build cannot notarise (no access to the signing secrets from a fork,
# and a 5-minute Apple round-trip per PR would be absurd), so it builds
# ad-hoc signed and says so. Only dispatch and tag runs produce a DMG that
# opens on someone else's Mac.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        required: false
        default: master
      sync_certs:
        description: >-
          Repair/init: mint the Developer ID Application certificate into
          the certs repo instead of building. Run this ONCE before the
          first notarised build.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/macos-app.yml
      - scripts/sign_and_notarize_macos.sh
      - macos/**
  push:
    # Only the release train's tags (v1.0.0+<build>, the '+' is the
    # mark): they come with a GitHub release to attach to. An F-Droid
    # tag (v1.0.0-fdroid.1, #716) has no release — F-Droid builds from
    # source — and a run on it can only end in "release not found".
    # '+' is a quantifier in GitHub's filter syntax — escaped, it is the
    # literal '+' of the train's tags.
    tags: ['v*\+*']
  # #570 — the release train reuses this workflow verbatim; sync_certs
  # stays dispatch-only (undeclared inputs read as false under call).
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: master

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  dmg:
    # Pinned like ios-testflight: macos-latest migrates under our feet.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: ruby/setup-ruby@v1
        if: ${{ github.event_name != 'pull_request' }}
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Decode App Store Connect API key
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_BASE64" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_BASE64 secret is not set." >&2
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/asc-api-key.p8"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "ASC_API_KEY_FILEPATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Set up SSH agent with match deploy key
        if: ${{ github.event_name != 'pull_request' }}
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MATCH_DEPLOY_KEY }}

      - name: Add github.com to known_hosts
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - name: Fetch the Developer ID certificate
        # NOT fatal when it is missing. Apple refuses to mint a Developer
        # ID certificate through an API key — "This operation can only be
        # performed by the Account Holder" — so until one is imported by
        # hand the build still has to produce something. It produces an
        # unsigned DMG and says so, rather than failing and leaving macOS
        # with no artifact at all.
        continue-on-error: true
        id: devid
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: ios
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          if [ "${{ inputs.sync_certs }}" = "true" ]; then
            bundle exec fastlane match_developer_id write:true
          else
            bundle exec fastlane match_developer_id
          fi

      - name: Build
        if: ${{ inputs.sync_certs != true }}
        run: |
          flutter pub get
          flutter build macos --release

      - name: Read version
        if: ${{ inputs.sync_certs != true }}
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sign, package and notarise
        id: notarise
        continue-on-error: true
        if: ${{ inputs.sync_certs != true && github.event_name != 'pull_request'
                && steps.devid.outcome == 'success' }}
        env:
          ASC_KEY: ${{ env.ASC_API_KEY_FILEPATH }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity in the keychain — run this workflow once with -f sync_certs=true." >&2
            exit 1
          fi
          export IDENTITY
          bash scripts/sign_and_notarize_macos.sh

      - name: Package unsigned
        # A PR proves the build and the packaging still work; it cannot
        # prove the signature, and pretending otherwise would ship a DMG
        # nobody can open. Same for a run whose Developer ID certificate
        # is not there yet — the NAME carries the warning, because a file
        # called DesKilo.dmg that macOS refuses is worse than one that
        # admits what it is.
        if: ${{ inputs.sync_certs != true
                && (github.event_name == 'pull_request'
                    || steps.devid.outcome != 'success'
                    || steps.notarise.outcome != 'success') }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE" build/macos/dmg
          cp -R build/macos/Build/Products/Release/DesKilo.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "DesKilo $VERSION" -srcfolder "$STAGE" \
            -ov -format UDZO "build/macos/dmg/DesKilo-$VERSION-unsigned.dmg"
          echo "DMG_PATH=build/macos/dmg/DesKilo-$VERSION-unsigned.dmg" >> "$GITHUB_ENV"

      - name: Say plainly what this DMG is
        if: ${{ inputs.sync_certs != true }}
        run: |
          if [[ "$DMG_PATH" == *unsigned* ]]; then
            echo "::warning::UNSIGNED build. macOS 15+ REFUSES to open a downloaded app that Apple has not notarised, and the right-click → Open bypass is gone: a user has to allow it under System Settings → Privacy & Security. Import a Developer ID certificate to fix this properly (see docs/guides/RELEASING.md)."
          else
            echo "Notarised: opens on a double-click."
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sync_certs != true }}
        with:
          name: deskilo-macos-${{ github.sha }}
          path: ${{ env.DMG_PATH }}
          retention-days: 14

      - name: Clean up decoded API key
        if: always()
        run: rm -f "$ASC_API_KEY_FILEPATH"

      - name: Attach to the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$DMG_PATH" --clobber
