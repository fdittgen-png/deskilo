name: fdroid-foss

# #716 — the F-Droid flavour stays buildable and Google-free. Does what
# fdroiddata's recipe does (swap the push package, build a release APK)
# and then asserts BOTH things F-Droid's scanner checks: no Google Play
# Services or Firebase class in the dex, and no extra APK signing block
# (#787 — AGP's 'Dependency metadata' failed exactly this on !47409,
# after the dex scan had already come back clean).

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'pubspec.yaml'
      - 'lib/core/push/**'
      - 'fdroid/**'
      - '.github/workflows/fdroid-foss.yml'
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'pubspec.yaml'
      - 'lib/core/push/**'
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  foss-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Swap in the FOSS push package (what fdroiddata's prebuild does)
        run: |
          sed -i 's|    path: packages/deskilo_push$|    path: packages/deskilo_push_foss|' pubspec.yaml
          grep -n 'deskilo_push_foss' pubspec.yaml
          flutter pub get

      - name: Analyze and test under the FOSS flavour
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          flutter analyze --fatal-infos lib test
          flutter test

      - name: Build the release APK
        run: flutter build apk --release --build-number=100000

      - name: Assert no Google Play Services or Firebase in the dex
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          mkdir -p dex && unzip -o -q "$APK" 'classes*.dex' -d dex
          hits=$(cat dex/classes*.dex | grep -a -c -E 'com/google/android/gms|com/google/firebase' || true)
          echo "gms/firebase references in dex: $hits"
          if [ "$hits" != "0" ]; then
            echo "::error::the FOSS APK still references Google services"; exit 1
          fi

      - name: Assert the APK carries no extra signing block
        run: |
          python3 - build/app/outputs/flutter-apk/app-release.apk <<'PY'
          import struct, sys

          # F-Droid refuses "extra signing blocks": anything in the APK
          # Signing Block that is not a signature scheme, a source stamp or
          # padding. AGP's dependency metadata (0x504b4453) is the usual
          # offender — a Google-signed blob nobody else can read.
          KNOWN = {
              0x7109871A: 'APK signature scheme v2',
              0xF05368C0: 'APK signature scheme v3',
              0x1B93AD61: 'APK signature scheme v3.1',
              0x2B09189E: 'source stamp v1',
              0x6DFF800D: 'source stamp v2',
              0x42726577: 'padding',
          }
          MAGIC = b'APK Sig Block 42'

          blob = open(sys.argv[1], 'rb').read()
          at = blob.rfind(MAGIC)
          if at < 0:
              sys.exit('::error::no APK signing block found — is the APK signed?')
          # [size (8)] [id-value pairs] [size (8)] [magic (16)]
          size = struct.unpack_from('<Q', blob, at - 8)[0]
          pos, end = at + 16 - size, at - 8

          extra = []
          while pos < end:
              length = struct.unpack_from('<Q', blob, pos)[0]
              ident = struct.unpack_from('<I', blob, pos + 8)[0]
              if ident not in KNOWN:
                  extra.append(f'0x{ident:08x}')
              else:
                  print(f'  block 0x{ident:08x}  {KNOWN[ident]}')
              pos += 8 + length

          if extra:
              sys.exit('::error::extra APK signing block(s) ' + ', '.join(extra) +
                       " — F-Droid's check-apk job refuses these; see "
                       'android/app/build.gradle.kts dependenciesInfo')
          print('no extra signing blocks')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: deskilo-foss-apk
          path: build/app/outputs/flutter-apk/app-release.apk
