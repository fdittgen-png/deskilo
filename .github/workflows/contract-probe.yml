name: CI · Contract probe

on:
  pull_request:
    paths:
      - 'tool/mcp_inspector/**'
      - 'contracts/mcp/**'
      - 'supabase/functions/deskilo-mcp/**'
      - '.github/workflows/contract-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: contract probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: tool/mcp_inspector/.node-version
      - run: npm ci --prefix tool/mcp_inspector
      - run: npm test --prefix tool/mcp_inspector
