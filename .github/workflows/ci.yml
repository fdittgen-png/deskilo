name: CI · Analyze, test & coverage

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: "3.44.9"

jobs:
  ci:
    name: analyze · l10n gate · test · coverage
    runs-on: ubuntu-latest
    # The suite is ~19 min on the runner now; 20 was cancelling green runs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: l10n gate — ARB pipeline is clean and committed
        run: |
          dart run tool/build_arb.dart
          flutter gen-l10n
          git diff --exit-code -- lib/l10n \
            || { echo "::error::lib/l10n drift — run 'dart run tool/build_arb.dart && flutter gen-l10n' and commit (HARD RULE #4)"; exit 1; }

      - name: Analyze (lib + test)
        run: flutter analyze

      - name: Tests with coverage
        run: flutter test --coverage

      # #1244 — the gate moved into `scripts/coverage_gate.sh`, so this
      # workflow and `CI · Quality report` measure it exactly the same
      # way, and the reasoning lives beside the numbers instead of in a
      # YAML comment nobody greps.
      #
      # It keeps the repository-wide 65% and adds a floor per LAYER,
      # which is the thing the old number could not say: `domain/` is at
      # 88.9%, and a percentage averaging it with 20 000 lines of
      # GENERATED localisation cannot tell you that.
      - name: Coverage gate
        run: bash scripts/coverage_gate.sh

      # ADVISORY, deliberately non-blocking: this repository has no branch
      # protection at all, so a hard failure here would redden every pull
      # request without any of them being at fault. It reports the drift so
      # the gap stays visible instead of living only in a document.
      # Promote it to a required check the day `apply` has been run.
      - name: Branch protection drift (advisory)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/branch_protection.sh verify
