name: CI · E-invoice validators

# #2358 — a pre-flight that checks which fields are present is not
# validation. This job builds one sample per e-invoice format with the
# app's own serializers (test/features/money/einvoice_samples_test.dart)
# and runs the OFFICIAL validators on them, each fetched at a pinned
# version and checked against its SHA-256 (tool/einvoice/validate.sh):
# KoSIT with the XRechnung and Peppol BIS configurations, Mustang for
# Factur-X, the SdI schema for FatturaPA and the KSeF schema for FA(3).
#
# lib/features/money/domain/einvoice_validation.dart lists the formats
# this job proves; the app claims "passes the official validator" for
# those formats only.

on:
  pull_request:
    paths:
      - 'lib/features/money/domain/**'
      - 'packages/deskilo_jurisdiction_*/**'
      - 'packages/deskilo_accounting_interchange/**'
      - 'packages/deskilo_invoice_model/**'
      - 'packages/deskilo_money_kernel/**'
      - 'packages/deskilo_tax_reference/**'
      - 'packages/deskilo_vat_declaration/**'
      - 'test/features/money/einvoice_samples_test.dart'
      - 'tool/einvoice/**'
      - '.github/workflows/einvoice-validate.yml'
  push:
    branches: [master]
    paths:
      - 'lib/features/money/domain/**'
      - 'packages/deskilo_jurisdiction_*/**'
      - 'packages/deskilo_accounting_interchange/**'
      - 'packages/deskilo_invoice_model/**'
      - 'packages/deskilo_money_kernel/**'
      - 'packages/deskilo_tax_reference/**'
      - 'packages/deskilo_vat_declaration/**'
      - 'tool/einvoice/**'
  workflow_dispatch:

concurrency:
  group: einvoice-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  validate:
    name: e-invoice samples · official validators
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # #3739 -- the package mirror being unreachable is not a finding about
      # the change: on a pull request the steps below are then skipped with a
      # notice; on master the job fails as before.
      - name: xmllint
        id: xmllint
        run: bash scripts/install_or_skip.sh xmllint libxml2-utils
      - if: steps.xmllint.outputs.available == 'true'
        run: flutter pub get
      - name: Build one sample per format
        if: steps.xmllint.outputs.available == 'true'
        env:
          EINVOICE_SAMPLES_DIR: ${{ runner.temp }}/einvoice-samples
        run: flutter test test/features/money/einvoice_samples_test.dart
      # #3473 -- the validators and schemas are checksum-pinned downloads;
      # kept under their digest, a warm cache asks no server.
      - name: Restore the pinned validator downloads
        if: steps.xmllint.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/deskilo-toolchain/einvoice
          key: toolchain-einvoice-${{ hashFiles('tool/einvoice/validate.sh') }}
      - name: Run the official validators
        if: steps.xmllint.outputs.available == 'true'
        run: |
          # #3663 -- exit 3: a validator's download did not answer (after its
          # retries). Nothing was validated this time; that is a notice, not a
          # failure of the change. Any other non-zero exit is a real failure.
          code=0
          EINVOICE_DL_CACHE="$HOME/.cache/deskilo-toolchain/einvoice" bash tool/einvoice/validate.sh \
            "${{ runner.temp }}/einvoice-samples" \
            "${{ runner.temp }}/einvoice-validators" || code=$?
          if [ "$code" = 3 ]; then
            echo "::notice::the validator did not answer: nothing was validated this time (re-run later)"
            exit 0
          fi
          exit "$code"
      - name: Summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/einvoice-validators/summary.md" ]; then
            cat "${{ runner.temp }}/einvoice-validators/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: einvoice-validation
          path: |
            ${{ runner.temp }}/einvoice-samples
            ${{ runner.temp }}/einvoice-validators/reports
            ${{ runner.temp }}/einvoice-validators/summary.md
