AntiFeatures:
  NonFreeNet:
    en-US: Defaults to the author's hosted server; changeable in Settings.
Categories:
  - Finance Manager
  - Schedule
License: 0BSD
AuthorName: Florian DITTGEN
SourceCode: https://github.com/fdittgen-png/deskilo
IssueTracker: https://github.com/fdittgen-png/deskilo/issues
Changelog: https://github.com/fdittgen-png/deskilo/releases

Description: |-
  Book a seat on the floor plan, check in with a QR or NFC badge, see
  who is in today, message members and groups, and — for owners — run
  the community's billing: invoices, payments, VAT declarations and
  e-invoicing. Multi-workspace, five languages, and each member reads
  amounts, dates and the clock in their own region.

  This build carries no push transport and no Google services:
  notifications arrive as local notifications and in the in-app inbox.

  The app is a client for its own backend (Supabase; the schema,
  row-level-security policies and edge functions are in the source
  repository under the same licence). It connects to the author's
  hosted instance by default — see the NonFreeNet note — and Settings →
  Server points it at a community's own Supabase project instead, with
  a connection test and a QR the owner shares with members.

  Privacy: data is stored in the EU, there is no tracking and no
  analytics, access is limited by role and enforced on the server, and
  who-can-see-my-data, the access log, data export and account erasure
  are buttons in Settings → Privacy & data.

RepoType: git
Repo: https://github.com/fdittgen-png/deskilo.git

Builds:
  - versionName: 1.0.0
    versionCode: 100001
    commit: v1.0.0-fdroid.3
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends cmake ninja-build
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.9
    prebuild: "sed -i 's|    path: packages/deskilo_push$|    path: packages/deskilo_push_foss|'
      pubspec.yaml"
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
      - $$flutter$$/bin/dart run build_runner build --delete-conflicting-outputs
      - $$flutter$$/bin/flutter gen-l10n
      - $$flutter$$/bin/flutter build apk --release --build-number=100001

AutoUpdateMode: None
UpdateCheckMode: None
CurrentVersion: 1.0.0
CurrentVersionCode: 100001
