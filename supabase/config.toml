#
# The LOCAL stack, and nothing else.
#
# This file exists so `supabase start` can raise a database in CI with
# the platform schemas the migrations actually use — `auth.uid()`,
# `auth.users`, `storage.objects`, the `anon` / `authenticated` /
# `service_role` roles, and the `extensions` schema that `digest`,
# `crypt` and `gen_salt` live in. A bare Postgres container has none of
# them, and stubbing them would mean testing the stub.
#
# It configures nothing about the hosted projects. The dev and prod
# projects are managed through the dashboard and `supabase/migrations/`;
# nothing here is ever pushed to either.
project_id = "deskilo"

[db]
port = 54322
shadow_port = 54320
# Matches the hosted projects — checked with `select version()` on the
# dev project, 2026-09-13: PostgreSQL 17.6.
major_version = 17

[db.migrations]
enabled = true

[auth]
enabled = true
# A local stack only ever sees the harness users the tests insert.
site_url = "http://127.0.0.1:3000"
enable_signup = true

# #1649 — the local stack behaves like a wizard-built instance
# (`mailer_autoconfirm: false`): a sign-up sends a confirmation LINK and
# issues no session, and the recovery e-mail carries the one-time code
# the app asks for. test/features/auth/local_auth_fixture_test.dart
# drives both against Mailpit below.
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.recovery]
subject = "Your DesKilo recovery code"
content_path = "./supabase/templates/auth/recovery.html"

[storage]
enabled = true

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[studio]
enabled = false

# Mailpit, on the CLI's default port; the auth fixture reads its API.
[inbucket]
enabled = true
port = 54324

[analytics]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false
