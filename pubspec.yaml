name: deskilo
description: "Free, privacy-first coworking community app — visual desk booking plus the community money layer."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (ADR 0001) — Riverpod 3 with codegen only
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Routing
  go_router: ^17.3.0

  # Theming (spec §14)
  flex_color_scheme: ^8.1.0

  # Local storage (ADR 0001)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.10.0

  # i18n (ADR 0007)
  intl: ^0.20.2
  supabase_flutter: ^2.15.4
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  qr_flutter: ^4.1.0
  flutter_zxing: ^2.3.0
  shared_preferences: ^2.5.5
  share_plus: ^13.2.0
  # First-class push (#426/#428, ADR 0011): FCM on Android/iOS/web/
  # macOS. Dart-only init from firebase_options.dart — the committed
  # stub disables it until the owner runs `flutterfire configure`
  # (docs/guides/push-setup.md).
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  # App-icon badge counter (#426): pending confirmations on the launcher
  # icon (Android launchers, iOS, macOS).
  app_badge_plus: ^1.2.4
  # Windows taskbar overlay badge (#444) — numbered .ico overlays from
  # assets/badges/ (generated, committed).
  windows_taskbar: ^1.1.2
  # #155 — opens the workspace's PayPal.me link from an unpaid statement.
  # Flutter-official, BSD-3.
  url_launcher: ^6.3.1

  # Bill PDF export (#133) — pure Dart. Deliberately NOT the
  # `printing` package: it pulls platform channels we don't need.
  pdf: ^3.12.0
  path_provider: ^2.1.6

  # Workspace configuration export/import (#164) — pure Dart, permissive,
  # Already in the tree as a transitive dependency.
  xml: ^6.6.1

  # Excel data export (#395): an .xlsx is a zip of XML, and this is the
  # zip. Pure Dart, MIT, already in the tree transitively — the workbook
  # itself is written by lib/core/files/xlsx.dart, no spreadsheet package.
  archive: ^4.0.9

  # XML import file picking (#165) — Flutter-official, BSD-3; the Android
  # implementation rides the Storage Access Framework, no GMS.
  file_selector: ^1.1.0
  nfc_manager: ^4.2.1

  # Browser download of an export (web target): the page hands the bytes to
  # the download machinery, since it has no folder to write to. Dart-team
  # package, already in the tree transitively.
  web: ^1.1.1
  markdown_widget: ^2.3.2+8
  liquify: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^4.0.2
  riverpod_lint: ^3.1.3
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  visibility_detector: ^0.4.0+2

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/badges/
    # Roboto (Apache-2.0, copied from the Flutter SDK) embedded into the
    # bill PDF: base-14 PDF fonts cannot encode '€'/'−' (#133).
    - assets/fonts/
    # In-app help, compiled from the wiki user guides by
    # `dart run tool/build_help.dart` — offline on every platform.
    - assets/help/
    - assets/help/images/
    # Brand icon on the boot splash — same artwork as the launcher icon.
    - assets/icon/icon_full.png
    # sRGB output intent (from the `pdf` package, freely redistributable):
    # PDF/A-3 demands an embedded colour profile, and Factur-X demands
    # PDF/A-3.
    - assets/pdf/
  # The SAME Roboto files the PDF embeds, as a Flutter family — the
  # report design surface renders glyph-identical to the document (#548).
  fonts:
    - family: ReportRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
