<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" role="img" aria-label="A booking's life: the client sends a request with a request id to create_reservation_once, which claims the id and calls create_reservation. enforce_booking_rules checks the rules and quota, a database exclusion constraint guards against overlapping bookings, the reservation row is committed and counts toward usage on the statement, and Realtime tells every client to refetch. A refused rule or a lost race returns a named error and writes nothing." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a2abc0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6b6b"/></marker></defs><rect width="1280" height="600" fill="#0f1420"/><rect x="22" y="120" width="176" height="150" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="110.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">1 · Request</text><text x="110.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">booking sheet</text><text x="110.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">request id minted</text><text x="110.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">kept on the device</text><rect x="234" y="120" width="176" height="150" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="322.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">2 · Claim once</text><text x="322.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">by request id</text><text x="322.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">one id, one booking</text><text x="322.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">a replay returns it</text><rect x="446" y="120" width="176" height="150" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="534.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">3 · Rules</text><text x="534.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">enforce_booking_rules</text><text x="534.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">horizon · hours</text><text x="534.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">quota, allowance</text><rect x="658" y="120" width="176" height="150" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="746.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">4 · Guard</text><text x="746.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">exclusion constraint</text><text x="746.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">per place and time</text><text x="746.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">overlap is impossible</text><rect x="870" y="120" width="176" height="150" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="958.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">5 · Commit</text><text x="958.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">reservation row</text><text x="958.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">counts as usage</text><text x="958.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">overage on statement</text><rect x="1082" y="120" width="176" height="150" rx="12" fill="#4f86c6" fill-opacity="0.16" stroke="#4f86c6" stroke-width="1.5"/><text x="1170.0" y="173.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">6 · Realtime</text><text x="1170.0" y="193.5" font-size="13" fill="#a2abc0" text-anchor="middle">change signal</text><text x="1170.0" y="211.5" font-size="13" fill="#a2abc0" text-anchor="middle">providers refetch</text><text x="1170.0" y="229.5" font-size="13" fill="#a2abc0" text-anchor="middle">every screen agrees</text><line x1="198" y1="195" x2="234" y2="195" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="410" y1="195" x2="446" y2="195" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="622" y1="195" x2="658" y2="195" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="834" y1="195" x2="870" y2="195" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="1046" y1="195" x2="1082" y2="195" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><text x="22" y="70" font-size="16" fill="#eef1f8" text-anchor="start" font-weight="700">The client asks. The database decides. Everything after the commit is a consequence.</text><rect x="234" y="320" width="540" height="130" rx="16" fill="#1b2434" stroke="#ef6b6b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="254" y="350" font-size="14" fill="#ef6b6b" text-anchor="start" font-weight="700">Refused before anything is written</text><text x="254" y="376" font-size="13" fill="#a2abc0" text-anchor="start">A rule says no (closed day, quota, hours, simultaneous allowance):</text><text x="254" y="396" font-size="13" fill="#a2abc0" text-anchor="start">the function raises a named error, the claim rolls back with it,</text><text x="254" y="416" font-size="13" fill="#a2abc0" text-anchor="start">and the sheet shows the reason in the member's language.</text><rect x="798" y="320" width="460" height="130" rx="16" fill="#1b2434" stroke="#ef6b6b" stroke-width="1.5" stroke-dasharray="6 5"/><text x="818" y="350" font-size="14" fill="#ef6b6b" text-anchor="start" font-weight="700">Lost the race</text><text x="818" y="376" font-size="13" fill="#a2abc0" text-anchor="start">Two people tap the same place:</text><text x="818" y="396" font-size="13" fill="#a2abc0" text-anchor="start">the second insert hits the constraint,</text><text x="818" y="416" font-size="13" fill="#a2abc0" text-anchor="start">and that person sees the place is taken.</text><path d="M 534,270 L 534,320" fill="none" stroke="#ef6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><path d="M 958,270 L 958,320" fill="none" stroke="#ef6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><rect x="22" y="320" width="190" height="130" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="38" y="350" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">Same path for</text><text x="38" y="376" font-size="13" fill="#a2abc0" text-anchor="start">app, QR or NFC</text><text x="38" y="396" font-size="13" fill="#a2abc0" text-anchor="start">scan and the wall</text><text x="38" y="416" font-size="13" fill="#a2abc0" text-anchor="start">kiosk.</text><rect x="22" y="480" width="1236" height="90" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="42" y="512" font-size="14" fill="#eef1f8" text-anchor="start">The ledger is a running account and append-only: a posted amount never changes, a correction is a new row.</text><text x="42" y="538" font-size="14" fill="#a2abc0" text-anchor="start">A booking does not write a ledger row; the statement derives usage and overage from reservations, and payments post credits.</text></svg>