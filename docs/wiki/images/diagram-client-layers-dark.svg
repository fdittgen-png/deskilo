<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Client layers: presentation depends on providers and the application layer, which depend on the pure-Dart domain; the data layer implements the domain's repository interfaces; presentation never imports data. Next to it, the feature-first folder shape: lib/app, lib/core, lib/l10n and lib/features/&lt;feature&gt; with domain, data, application, providers and presentation." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a2abc0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6b6b"/></marker></defs><rect width="1200" height="640" fill="#0f1420"/><rect x="30" y="40" width="640" height="560" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="48" y="66" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">ONE FEATURE, FOUR RINGS</text><rect x="70" y="90" width="330" height="86" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="235.0" y="129.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">presentation</text><text x="235.0" y="149.5" font-size="13" fill="#a2abc0" text-anchor="middle">screens and widgets, ARB strings</text><rect x="70" y="230" width="330" height="86" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="235.0" y="269.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">providers + application</text><text x="235.0" y="289.5" font-size="13" fill="#a2abc0" text-anchor="middle">Riverpod codegen · commands that decide</text><rect x="70" y="370" width="330" height="86" rx="12" fill="#4f86c6" fill-opacity="0.16" stroke="#4f86c6" stroke-width="1.5"/><text x="235.0" y="400.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">domain</text><text x="235.0" y="420.5" font-size="13" fill="#a2abc0" text-anchor="middle">pure Dart · freezed models</text><text x="235.0" y="438.5" font-size="13" fill="#a2abc0" text-anchor="middle">repository interfaces</text><rect x="440" y="370" width="200" height="86" rx="12" fill="#e0902c" fill-opacity="0.16" stroke="#e0902c" stroke-width="1.5"/><text x="540.0" y="409.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">data</text><text x="540.0" y="429.5" font-size="13" fill="#a2abc0" text-anchor="middle">Supabase repositories</text><line x1="235" y1="176" x2="235" y2="230" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="235" y1="316" x2="235" y2="370" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><line x1="440" y1="413" x2="400" y2="413" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)"/><text x="420" y="358" font-size="13" fill="#2dd4bf" text-anchor="middle">implements</text><path d="M 400,133 C 560,133 540,300 540,366" fill="none" stroke="#ef6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><text x="548" y="230" font-size="13" fill="#ef6b6b" text-anchor="start" font-weight="700">no data imports</text><text x="548" y="248" font-size="13" fill="#ef6b6b" text-anchor="start">(lint-enforced)</text><text x="70" y="500" font-size="14" fill="#eef1f8" text-anchor="start">Tests swap data for fakes through one override list.</text><text x="70" y="526" font-size="14" fill="#a2abc0" text-anchor="start">A ratchet file caps cross-feature imports; it may only shrink.</text><text x="70" y="552" font-size="14" fill="#a2abc0" text-anchor="start">Shared widgets and tokens live in core/, not in a feature.</text><rect x="710" y="40" width="460" height="560" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="728" y="66" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">THE FOLDER SHAPE</text><text x="736" y="106" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">lib/</text><text x="758" y="140" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">app/</text><text x="960" y="140" font-size="13" fill="#a2abc0" text-anchor="start">router, shell, boot</text><text x="758" y="174" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">core/</text><text x="960" y="174" font-size="13" fill="#a2abc0" text-anchor="start">theme, backend, cache</text><text x="758" y="208" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">l10n/</text><text x="960" y="208" font-size="13" fill="#a2abc0" text-anchor="start">ARB ×5 + generated</text><text x="758" y="242" font-size="14" fill="#eef1f8" text-anchor="start" font-weight="700">features/</text><text x="780" y="276" font-size="14" fill="#2dd4bf" text-anchor="start" font-weight="700">&lt;feature&gt;/domain</text><text x="960" y="276" font-size="13" fill="#a2abc0" text-anchor="start">models, interfaces</text><text x="780" y="310" font-size="14" fill="#2dd4bf" text-anchor="start" font-weight="700">&lt;feature&gt;/data</text><text x="960" y="310" font-size="13" fill="#a2abc0" text-anchor="start">Supabase code</text><text x="780" y="344" font-size="14" fill="#2dd4bf" text-anchor="start" font-weight="700">&lt;feature&gt;/application</text><text x="960" y="344" font-size="13" fill="#a2abc0" text-anchor="start">commands</text><text x="780" y="378" font-size="14" fill="#2dd4bf" text-anchor="start" font-weight="700">&lt;feature&gt;/providers</text><text x="960" y="378" font-size="13" fill="#a2abc0" text-anchor="start">Riverpod</text><text x="780" y="412" font-size="14" fill="#2dd4bf" text-anchor="start" font-weight="700">&lt;feature&gt;/presentation</text><text x="960" y="412" font-size="13" fill="#a2abc0" text-anchor="start">screens, widgets</text><text x="736" y="452" font-size="13" fill="#a2abc0" text-anchor="start">Features today: auth, calendar, directory, editor, events,</text><text x="736" y="472" font-size="13" fill="#a2abc0" text-anchor="start">help, kiosk, mcp, me, members, money, plan, profile,</text><text x="736" y="492" font-size="13" fill="#a2abc0" text-anchor="start">reservations, task_recorder, visits, workspace.</text><text x="736" y="530" font-size="13" fill="#a2abc0" text-anchor="start">Some features have no data/ or application/ yet;</text><text x="736" y="550" font-size="13" fill="#a2abc0" text-anchor="start">a folder appears when a feature needs it.</text></svg>