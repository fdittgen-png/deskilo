<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="The test pyramid and quality gates: unit tests at the base, widget tests above, end to end tests at the top, beside lint ratchets, pgTAP database tests, migration replay and generated-file drift gates, all reported by the CI quality report." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker></defs>
<rect width="1200" height="500" fill="#0f1420"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#eef1f8">What guards a change</text>
<rect x="230.0" y="84" width="200" height="86" rx="14" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1.8"/>
<text x="330" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">End to end</text>
<text x="330" y="142" text-anchor="middle" font-size="13" fill="#a2abc0">boot test, journey benchmark</text>
<rect x="140.0" y="184" width="380" height="86" rx="14" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.8"/>
<text x="330" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">Widget tests</text>
<text x="330" y="242" text-anchor="middle" font-size="13" fill="#a2abc0">whole app, fakes, no goldens</text>
<rect x="50.0" y="284" width="560" height="86" rx="14" fill="#2dd4bf" fill-opacity="0.22" stroke="#2dd4bf" stroke-width="1.8"/>
<text x="330" y="320" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">Unit tests</text>
<text x="330" y="342" text-anchor="middle" font-size="13" fill="#a2abc0">domain and data, pure Dart</text>
<text x="330" y="400" text-anchor="middle" font-size="13" fill="#a2abc0">target shape 10 / 20 / 70 (tool/test_inventory.dart)</text>
<text x="700" y="76" font-size="14" font-weight="700" fill="#a2abc0">STRUCTURE AND DATABASE GATES</text>
<rect x="700" y="90" width="460" height="70" rx="14" fill="#1b2434" stroke="#4f86c6" stroke-width="1.8"/>
<text x="930.0" y="116" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">Lint ratchets</text>
<text x="930.0" y="138" text-anchor="middle" font-size="13" fill="#a2abc0">test/lint: strings, layering, registries, dead code</text>
<rect x="700" y="174" width="460" height="70" rx="14" fill="#1b2434" stroke="#4f86c6" stroke-width="1.8"/>
<text x="930.0" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">pgTAP</text>
<text x="930.0" y="222" text-anchor="middle" font-size="13" fill="#a2abc0">RLS and invariants proved in the database</text>
<rect x="700" y="258" width="460" height="70" rx="14" fill="#1b2434" stroke="#4f86c6" stroke-width="1.8"/>
<text x="930.0" y="284" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">Migration replay</text>
<text x="930.0" y="306" text-anchor="middle" font-size="13" fill="#a2abc0">every file onto an empty Postgres, then the contract</text>
<rect x="700" y="342" width="460" height="70" rx="14" fill="#1b2434" stroke="#4f86c6" stroke-width="1.8"/>
<text x="930.0" y="368" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">Drift gates</text>
<text x="930.0" y="390" text-anchor="middle" font-size="13" fill="#a2abc0">l10n, build_runner, bundle, catalogues</text>
<rect x="40" y="420" width="1120" height="52" rx="14" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.8"/>
<text x="600" y="452" text-anchor="middle" font-size="16" font-weight="700" fill="#eef1f8">CI quality report: one table, one row per discipline, three required checks</text>
</svg>
