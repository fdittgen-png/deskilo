<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The permission model: a feature flag must be on for a surface to exist; the member's role maps through the role-to-permission matrix to one of 31 permissions; the same permission is enforced three times, hiding the control in the screen, refusing in the SECURITY DEFINER function, and filtering rows in RLS. Some acts also need a confirmation by other people under a validation policy." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6277"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker></defs><rect width="1200" height="640" fill="#fdfcf9"/><rect x="30" y="90" width="230" height="130" rx="12" fill="#b45309" fill-opacity="0.12" stroke="#b45309" stroke-width="1.5"/><text x="145.0" y="133.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">1 · Feature flag</text><text x="145.0" y="153.5" font-size="13" fill="#5a6277" text-anchor="middle">workspace module</text><text x="145.0" y="171.5" font-size="13" fill="#5a6277" text-anchor="middle">feature_effective(…)</text><text x="145.0" y="189.5" font-size="13" fill="#5a6277" text-anchor="middle">off: no entry, no route</text><rect x="320" y="90" width="230" height="130" rx="12" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="1.5"/><text x="435.0" y="133.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">2 · Role</text><text x="435.0" y="153.5" font-size="13" fill="#5a6277" text-anchor="middle">owner · co-owner</text><text x="435.0" y="171.5" font-size="13" fill="#5a6277" text-anchor="middle">admin · member</text><text x="435.0" y="189.5" font-size="13" fill="#5a6277" text-anchor="middle">custom roles add grants</text><rect x="610" y="90" width="230" height="130" rx="12" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="1.5"/><text x="725.0" y="133.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">3 · Permission</text><text x="725.0" y="153.5" font-size="13" fill="#5a6277" text-anchor="middle">31 named permissions</text><text x="725.0" y="171.5" font-size="13" fill="#5a6277" text-anchor="middle">one matrix, editable</text><text x="725.0" y="189.5" font-size="13" fill="#5a6277" text-anchor="middle">has_permission(…)</text><line x1="260" y1="155" x2="320" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><line x1="550" y1="155" x2="610" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><rect x="880" y="60" width="290" height="190" rx="16" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="898" y="86" font-size="13" fill="#5a6277" text-anchor="start" font-weight="700">ENFORCED THREE TIMES</text><rect x="900" y="92" width="250" height="44" rx="12" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="1025.0" y="119.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Screen hides the control</text><rect x="900" y="144" width="250" height="44" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="1025.0" y="171.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">RPC refuses the call</text><rect x="900" y="196" width="250" height="44" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="1025.0" y="223.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">RLS filters the rows</text><line x1="840" y1="155" x2="880" y2="155" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><text x="30" y="60" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">A surface needs its flag on. A request needs the permission.</text><rect x="30" y="300" width="1140" height="150" rx="16" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="48" y="326" font-size="13" fill="#5a6277" text-anchor="start" font-weight="700">WHEN AN ACT NEEDS OTHER PEOPLE</text><rect x="50" y="340" width="250" height="90" rx="12" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="175.0" y="381.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Validation policy</text><text x="175.0" y="401.5" font-size="13" fill="#5a6277" text-anchor="middle">per event type</text><rect x="340" y="340" width="250" height="90" rx="12" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="465.0" y="381.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Pending event</text><text x="465.0" y="401.5" font-size="13" fill="#5a6277" text-anchor="middle">waits, nothing applied</text><rect x="630" y="340" width="250" height="90" rx="12" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="755.0" y="381.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Confirmation</text><text x="755.0" y="401.5" font-size="13" fill="#5a6277" text-anchor="middle">nobody validates their own event</text><rect x="920" y="340" width="230" height="90" rx="12" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="1035.0" y="381.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Applied + audited</text><text x="1035.0" y="401.5" font-size="13" fill="#5a6277" text-anchor="middle">a decision row records who</text><line x1="300" y1="385" x2="340" y2="385" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><line x1="590" y1="385" x2="630" y2="385" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><line x1="880" y1="385" x2="920" y2="385" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><rect x="30" y="480" width="1140" height="120" rx="16" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="50" y="512" font-size="14" fill="#1b2236" text-anchor="start">The client is never the enforcement layer. Revoking a permission revokes it everywhere at once:</text><text x="50" y="538" font-size="14" fill="#1b2236" text-anchor="start">the screen stops showing the control, and the server would refuse the call anyway.</text><text x="50" y="570" font-size="14" fill="#5a6277" text-anchor="start">Invariants such as "the last owner cannot be removed" live in triggers, so no code path can skip them.</text></svg>