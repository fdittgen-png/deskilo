<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="The release train: one dispatch resolves master to a single commit and ships it to Android on Play, iPhone and iPad on TestFlight, macOS and Windows installers, and the web, while F-Droid is submitted but not yet published." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker></defs>
<rect width="1200" height="470" fill="#fdfcf9"/>
<text x="40" y="44" font-size="20" font-weight="700" fill="#1b2236">The release train</text>
<rect x="40" y="150" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.8"/>
<text x="155.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">Merged master</text>
<text x="155.0" y="198" text-anchor="middle" font-size="13" fill="#5a6277">one commit, resolved once</text>
<rect x="330" y="150" width="230" height="90" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
<text x="445.0" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">Release train</text>
<text x="445.0" y="198" text-anchor="middle" font-size="13" fill="#5a6277">track: alpha or production</text>
<line x1="270" y1="195" x2="330" y2="195" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="70" width="480" height="70" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="1.8"/>
<text x="920.0" y="96" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">Android</text>
<text x="920.0" y="118" text-anchor="middle" font-size="13" fill="#5a6277">alpha: Play closed test | production: Play production</text>
<path d="M560 195 C620 195 620 105 680 105" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="154" width="480" height="70" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="1.8"/>
<text x="920.0" y="180" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">iPhone and iPad</text>
<text x="920.0" y="202" text-anchor="middle" font-size="13" fill="#5a6277">TestFlight external group, public link</text>
<path d="M560 195 C620 195 620 189 680 189" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="238" width="480" height="70" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="1.8"/>
<text x="920.0" y="264" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">macOS DMG, Windows MSI</text>
<text x="920.0" y="286" text-anchor="middle" font-size="13" fill="#5a6277">artifacts on the release; same build both tracks</text>
<path d="M560 195 C620 195 620 273 680 273" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="322" width="480" height="70" rx="14" fill="#ffffff" stroke="#4f86c6" stroke-width="1.8"/>
<text x="920.0" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">Web</text>
<text x="920.0" y="370" text-anchor="middle" font-size="13" fill="#5a6277">alpha: build check | production: Pages deploy</text>
<path d="M560 195 C620 195 620 357 680 357" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#a)"/>
<rect x="680" y="406" width="480" height="70" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="920.0" y="432" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2236">F-Droid</text>
<text x="920.0" y="454" text-anchor="middle" font-size="13" fill="#5a6277">submitted, not published; recipe frozen</text>
<text x="40" y="320" font-size="13" fill="#5a6277">Legs are independent: a failed leg never stops the others, and the</text>
<text x="40" y="340" font-size="13" fill="#5a6277">report job opens an issue naming it. Web publishing alone: web.yml with deploy=true.</text>
<text x="40" y="380" font-size="13" fill="#d32f2f">Never the alpha1 track. Shipping does not advance the Play production countdown.</text>
</svg>
