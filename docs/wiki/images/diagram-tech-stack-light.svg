<text x="320" y="248" font-size="14" fill="#1b2236" text-anchor="start">flutter_riverpod · riverpod_annotation · freezed_annotation · json_annotation</text>
<text x="320" y="274" font-size="14" fill="#1b2236" text-anchor="start">intl · five ARB languages · timezone · meta</text>
