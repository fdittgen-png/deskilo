<text x="60" y="360" font-size="17" fill="#1b2236" text-anchor="start" font-weight="700">Data and documents</text>
<text x="60" y="384" font-size="13" fill="#5a6277" text-anchor="start">one repository per feature</text>
<text x="320" y="360" font-size="14" fill="#1b2236" text-anchor="start">supabase_flutter · dio · http · hive · shared_preferences · flutter_secure_storage</text>
