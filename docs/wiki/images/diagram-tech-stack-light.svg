<text x="320" y="472" font-size="14" fill="#1b2236" text-anchor="start">Postgres with row-level security · 406 migrations · security definer RPCs</text>
<text x="320" y="498" font-size="14" fill="#1b2236" text-anchor="start">9 edge functions · instance bundle for the in-app wizard</text>
