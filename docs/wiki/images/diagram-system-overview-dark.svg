<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="System overview: Flutter clients on Android, iOS, web and desktop talk to a Supabase backend (Auth, Postgres with row level security and RPC functions, Storage, Realtime, Edge Functions), which calls external services (payment providers, push, e-invoicing, VIES, Photon geocoding). The backend is either self-hosted or the shared reference deployment." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a2abc0"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6b6b"/></marker></defs><rect width="1200" height="720" fill="#0f1420"/><rect x="30" y="40" width="260" height="440" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="48" y="66" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">CLIENTS · ONE CODEBASE</text><rect x="50" y="80" width="220" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="160.0" y="115.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Android</text><text x="160.0" y="135.5" font-size="13" fill="#a2abc0" text-anchor="middle">Play closed test · F-Droid</text><rect x="50" y="178" width="220" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="160.0" y="213.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">iPhone / iPad</text><text x="160.0" y="233.5" font-size="13" fill="#a2abc0" text-anchor="middle">TestFlight beta</text><rect x="50" y="276" width="220" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="160.0" y="311.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Web</text><text x="160.0" y="331.5" font-size="13" fill="#a2abc0" text-anchor="middle">browser · demo included</text><rect x="50" y="374" width="220" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="160.0" y="409.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Desktop</text><text x="160.0" y="429.5" font-size="13" fill="#a2abc0" text-anchor="middle">macOS · Windows</text><rect x="430" y="40" width="340" height="440" rx="16" fill="#1b2434" stroke="#2dd4bf" stroke-width="1.5"/><text x="448" y="66" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">SUPABASE · THE SERVER</text><rect x="450" y="78" width="300" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="600.0" y="107.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Auth</text><text x="600.0" y="127.5" font-size="13" fill="#a2abc0" text-anchor="middle">sign-in, sessions, OAuth</text><rect x="450" y="156" width="300" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="600.0" y="185.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Postgres</text><text x="600.0" y="205.5" font-size="13" fill="#a2abc0" text-anchor="middle">RLS · RPC · triggers · ledger</text><rect x="450" y="234" width="300" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="600.0" y="263.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Storage</text><text x="600.0" y="283.5" font-size="13" fill="#a2abc0" text-anchor="middle">floor plans, avatars</text><rect x="450" y="312" width="300" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="600.0" y="341.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Realtime</text><text x="600.0" y="361.5" font-size="13" fill="#a2abc0" text-anchor="middle">change signals per table</text><rect x="450" y="390" width="300" height="66" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-width="1.5"/><text x="600.0" y="419.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Edge Functions</text><text x="600.0" y="439.5" font-size="13" fill="#a2abc0" text-anchor="middle">payments, push, MCP, e-invoice</text><rect x="930" y="40" width="240" height="440" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="948" y="66" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">EXTERNAL SERVICES</text><rect x="945" y="80" width="210" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="1050.0" y="115.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Payment providers</text><text x="1050.0" y="135.5" font-size="13" fill="#a2abc0" text-anchor="middle">PayPal · Stripe · Mollie</text><rect x="945" y="178" width="210" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="1050.0" y="213.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Push</text><text x="1050.0" y="233.5" font-size="13" fill="#a2abc0" text-anchor="middle">FCM · none in F-Droid</text><rect x="945" y="276" width="210" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="1050.0" y="311.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">E-invoicing</text><text x="1050.0" y="331.5" font-size="13" fill="#a2abc0" text-anchor="middle">provider · VIES check</text><rect x="945" y="374" width="210" height="78" rx="12" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="1050.0" y="409.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Photon</text><text x="1050.0" y="429.5" font-size="13" fill="#a2abc0" text-anchor="middle">address search</text><line x1="290" y1="260" x2="430" y2="260" stroke="#2dd4bf" stroke-width="2" marker-end="url(#at)" marker-start="url(#at)"/><text x="360" y="244" font-size="13" fill="#2dd4bf" text-anchor="middle">RPC · realtime</text><line x1="770" y1="200" x2="930" y2="200" stroke="#a2abc0" stroke-width="2" marker-end="url(#a)"/><text x="850" y="184" font-size="13" fill="#a2abc0" text-anchor="middle">server side only</text><line x1="930" y1="290" x2="770" y2="290" stroke="#a2abc0" stroke-width="2" marker-end="url(#a)"/><text x="850" y="280" font-size="13" fill="#a2abc0" text-anchor="middle">signed webhooks</text><text x="360" y="284" font-size="13" fill="#a2abc0" text-anchor="middle">HTTPS + WebSocket</text><rect x="30" y="510" width="555" height="180" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="48" y="536" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">ONE SERVER, TWO WAYS TO HAVE IT</text><rect x="48" y="548" width="250" height="124" rx="12" fill="#1b2434" stroke="#2dd4bf" stroke-width="1.5"/><text x="173.0" y="588.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Self-hosted</text><text x="173.0" y="608.5" font-size="13" fill="#a2abc0" text-anchor="middle">your Supabase project</text><text x="173.0" y="626.5" font-size="13" fill="#a2abc0" text-anchor="middle">the migrations build it</text><text x="173.0" y="644.5" font-size="13" fill="#a2abc0" text-anchor="middle">an instance doctor checks it</text><rect x="316" y="548" width="250" height="124" rx="12" fill="#1b2434" stroke="#2dd4bf" stroke-width="1.5"/><text x="441.0" y="588.5" font-size="15" fill="#eef1f8" text-anchor="middle" font-weight="700">Reference deployment</text><text x="441.0" y="608.5" font-size="13" fill="#a2abc0" text-anchor="middle">shared and hosted</text><text x="441.0" y="626.5" font-size="13" fill="#a2abc0" text-anchor="middle">default of the web app</text><text x="441.0" y="644.5" font-size="13" fill="#a2abc0" text-anchor="middle">holds the global directory</text><rect x="615" y="510" width="555" height="180" rx="16" fill="#1b2434" stroke="#2f3d52" stroke-width="1.5"/><text x="633" y="536" font-size="13" fill="#a2abc0" text-anchor="start" font-weight="700">WHAT A CLIENT NEEDS TO KNOW</text><text x="635" y="566" font-size="14" fill="#eef1f8" text-anchor="start">A server URL and a publishable key (RLS is the boundary).</text><text x="635" y="594" font-size="14" fill="#eef1f8" text-anchor="start">Several servers may be connected; a person keeps one</text><text x="635" y="622" font-size="14" fill="#eef1f8" text-anchor="start">account per server and Me merges what they answer.</text><text x="635" y="650" font-size="14" fill="#eef1f8" text-anchor="start">The demo workspace has no backend behind it at all.</text></svg>