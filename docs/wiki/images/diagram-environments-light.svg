<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Environments: a workspace can be a pair of twins, development and production. The deployment engine exports entities from one side, previews what would change, deploys to the side the caller stands on, records the deployment with what the target held before, and can roll it back. Production members are always also development members." font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6277"/></marker><marker id="at" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker></defs><rect width="1200" height="640" fill="#fdfcf9"/><text x="30" y="60" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">A linked pair is two workspaces; the engine moves configuration and master data between them.</text><rect x="30" y="100" width="300" height="120" rx="12" fill="#b45309" fill-opacity="0.12" stroke="#b45309" stroke-width="1.5"/><text x="180.0" y="147.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Development</text><text x="180.0" y="167.5" font-size="13" fill="#5a6277" text-anchor="middle">the rehearsal space</text><text x="180.0" y="185.5" font-size="13" fill="#5a6277" text-anchor="middle">test data · DEV colour</text><rect x="30" y="300" width="300" height="120" rx="12" fill="#0f766e" fill-opacity="0.12" stroke="#0f766e" stroke-width="1.5"/><text x="180.0" y="347.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Production</text><text x="180.0" y="367.5" font-size="13" fill="#5a6277" text-anchor="middle">the real space</text><text x="180.0" y="385.5" font-size="13" fill="#5a6277" text-anchor="middle">members, ledger, invoices</text><path d="M 130,220 L 130,300" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#at)" marker-start="url(#at)"/><path d="M 230,220 L 230,300" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#at)" marker-start="url(#at)"/><text x="150" y="265" font-size="13" fill="#5a6277" text-anchor="start">twins</text><rect x="380" y="90" width="790" height="340" rx="16" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="398" y="116" font-size="13" fill="#5a6277" text-anchor="start" font-weight="700">THE DEPLOYMENT ENGINE</text><rect x="400" y="140" width="170" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="485.0" y="177.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Export</text><text x="485.0" y="197.5" font-size="13" fill="#5a6277" text-anchor="middle">export_entities</text><text x="485.0" y="215.5" font-size="13" fill="#5a6277" text-anchor="middle">reads one side</text><rect x="590" y="140" width="170" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="675.0" y="177.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Preview</text><text x="675.0" y="197.5" font-size="13" fill="#5a6277" text-anchor="middle">preview_deployment</text><text x="675.0" y="215.5" font-size="13" fill="#5a6277" text-anchor="middle">what would change</text><rect x="780" y="140" width="170" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="865.0" y="177.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Deploy</text><text x="865.0" y="197.5" font-size="13" fill="#5a6277" text-anchor="middle">deploy_entities</text><text x="865.0" y="215.5" font-size="13" fill="#5a6277" text-anchor="middle">writes your side</text><rect x="970" y="140" width="170" height="100" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/><text x="1055.0" y="177.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Log</text><text x="1055.0" y="197.5" font-size="13" fill="#5a6277" text-anchor="middle">deployments</text><text x="1055.0" y="215.5" font-size="13" fill="#5a6277" text-anchor="middle">who, when, direction</text><line x1="570" y1="190" x2="590" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><line x1="760" y1="190" x2="780" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><line x1="950" y1="190" x2="970" y2="190" stroke="#0f766e" stroke-width="2" marker-end="url(#at)"/><path d="M 1055,240 L 1055,290 L 485,290 L 485,320" fill="none" stroke="#d32f2f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/><rect x="400" y="320" width="170" height="90" rx="12" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/><text x="485.0" y="352.5" font-size="15" fill="#1b2236" text-anchor="middle" font-weight="700">Roll back</text><text x="485.0" y="372.5" font-size="13" fill="#5a6277" text-anchor="middle">rollback_deployment</text><text x="485.0" y="390.5" font-size="13" fill="#5a6277" text-anchor="middle">exact, from the log</text><text x="590" y="340" font-size="14" fill="#1b2236" text-anchor="start">Floor plans are merged, never replaced.</text><text x="590" y="364" font-size="14" fill="#5a6277" text-anchor="start">Floor plans, payment instructions and design images</text><text x="590" y="386" font-size="14" fill="#5a6277" text-anchor="start">travel as their own entities.</text><rect x="30" y="460" width="1140" height="150" rx="16" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/><text x="48" y="486" font-size="13" fill="#5a6277" text-anchor="start" font-weight="700">THE RULES AROUND IT</text><text x="50" y="520" font-size="14" fill="#1b2236" text-anchor="start">Three permissions: accessProd (enter prod), deployToDev, deployToProd (which implies deployToDev).</text><text x="50" y="544" font-size="14" fill="#1b2236" text-anchor="start">Invariant: every production member is also a development member (a mirror trigger keeps it so).</text><text x="50" y="568" font-size="14" fill="#5a6277" text-anchor="start">An invitation chooses "dev", or "dev and prod". Never prod alone.</text><text x="50" y="592" font-size="14" fill="#5a6277" text-anchor="start">Me is production: a development space never counts in Me; its documents are marked DEV.</text></svg>