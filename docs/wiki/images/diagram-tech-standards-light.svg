<text x="800" y="458" font-size="14" fill="#1b2236" text-anchor="start">Routing: how an invoice travels</text>
<rect x="784" y="484" width="352" height="40" rx="10" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/>
<text x="800" y="510" font-size="14" fill="#1b2236" text-anchor="start">Server computes the VAT return</text>
</g></svg>