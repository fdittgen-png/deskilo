<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="The standards map: which export or invoice format sits on which module of the app.">
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1200" height="640" rx="22" fill="#fdfcf9"/>
<text x="40" y="48" font-size="22" fill="#1b2236" text-anchor="start" font-weight="700">Which standard sits on which module</text>
<text x="40" y="72" font-size="14" fill="#5a6277" text-anchor="start">Only formats the code writes. Each box names the file in lib/features/money/domain/ (or the module).</text>
<rect x="40" y="104" width="640" height="88" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/>
