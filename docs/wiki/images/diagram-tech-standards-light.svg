<rect x="40" y="504" width="640" height="88" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/>
<text x="60" y="534" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">Post and calendar</text>
<text x="60" y="560" font-size="14" fill="#1b2236" text-anchor="start">NF Z 10-011 address block, iCalendar</text>
<text x="60" y="580" font-size="12" fill="#5a6277" text-anchor="start">personal_info.dart · reservation_calendar_file.dart</text>
