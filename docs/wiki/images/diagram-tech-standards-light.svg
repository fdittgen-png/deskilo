<text x="60" y="180" font-size="12" fill="#5a6277" text-anchor="start">invoice_ubl.dart · invoice_cii.dart</text>
<line x1="682" y1="148" x2="758" y2="148" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="204" width="640" height="88" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/>
<text x="60" y="234" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">Validation</text>
<text x="60" y="260" font-size="14" fill="#1b2236" text-anchor="start">EN 16931 business rules, VIES VAT id</text>
<text x="60" y="280" font-size="12" fill="#5a6277" text-anchor="start">invoice_ubl_check.dart · vies-check</text>
<line x1="682" y1="248" x2="758" y2="248" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/>
<rect x="40" y="304" width="640" height="88" rx="14" fill="#ffffff" stroke="#d8e0de" stroke-width="1.5"/>
<text x="60" y="334" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">Accounting exports</text>
<text x="60" y="360" font-size="14" fill="#1b2236" text-anchor="start">FEC · DATEV EXTF · SAF-T · Sage</text>
<text x="60" y="380" font-size="12" fill="#5a6277" text-anchor="start">fec.dart · datev.dart · saf_t.dart · sage.dart</text>
<line x1="682" y1="348" x2="758" y2="348" stroke="#0f766e" stroke-width="2" marker-end="url(#ar)"/>
