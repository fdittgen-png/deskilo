<text x="60" y="434" font-size="16" fill="#1b2236" text-anchor="start" font-weight="700">VAT returns</text>
<text x="60" y="460" font-size="14" fill="#1b2236" text-anchor="start">Directive 2006/112/EC, EU sales list</text>
<text x="60" y="480" font-size="12" fill="#5a6277" text-anchor="start">vat_declaration.dart · recapitulative_statement.dart</text>
